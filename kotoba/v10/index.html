 g:[`I ___ a student.~am~is~are~be~I に続くbe動詞は am。;She ___ cats.~likes~like~liking~to like~三人称単数の現在形には -s を付けます。;This is ___ apple.~an~a~the~are~母音で始まる単数名詞には an を使えます。;___ you from Japan?~Are~Is~Am~Be~主語 you には Are。`, `He ___ to work every day.~goes~go~going~gone~he は三人称単数なので goes。;Where ___ you go yesterday?~did~do~does~are~過去の疑問文には did。;I am ___ dinner now.~cooking~cook~cooked~cooks~現在進行形は be + -ing。;She is taller ___ me.~than~then~to~with~比較級には than。`, `I have lived here ___ 2020.~since~for~during~until~開始時点には since。;The letter ___ yesterday.~was sent~sent by~sending~has send~過去の受動態は was + 過去分詞。;This is the person ___ helped me.~who~where~when~whose~人を説明する関係代名詞は who。;Could you tell me where the station ___?~is~does~are~be~間接疑問文では通常の語順になります。`, `If I ___ you, I would apologize.~were~am~will be~be~現実と異なる仮定では If I were you。;Had I known, I ___ helped.~would have~will have~had~have~過去の仮定に反する結果は would have + 過去分詞。;___ the rain, we played.~Despite~Although~Because~Unless~名詞句 the rain の前は前置詞 Despite。;Not only he but also I ___ ready.~am~is~are~be~近い主語 I に一致します。`],
 l:[`Hello, how are you?=こんにちは、お元気ですか？;I like music.=私は音楽が好きです。;Where is my book?=私の本はどこですか？;Thank you very much.=本当にありがとうございます。`, `I take the train every morning.=私は毎朝電車に乗ります。;Are you free tomorrow?=明日は空いていますか？;I watched a movie yesterday.=私は昨日映画を見ました。;The station is near here.=駅はこの近くです。`, `Could you recommend a restaurant?=おすすめのレストランはありますか？;I have already finished my homework.=私はすでに宿題を終えました。;I would like to change my appointment.=予約を変更したいです。;Perhaps we should leave earlier.=もっと早く出発したほうがいいかもしれません。`, `Although it was difficult, we succeeded.=難しかったけれど、私たちは成功しました。;We need more reliable evidence.=もっと信頼できる証拠が必要です。;Unless it rains, the event will take place.=雨が降らない限りイベントは開催されます。;Efficiency is not the only concern.=効率だけが懸念事項ではありません。`],
 r:[`Mia has a dog. The dog is small and friendly.~ミアが飼っているのは？~犬~猫~鳥~魚~has a dog が手がかりです。;Ken lives in Tokyo. He likes reading books.~ケンの趣味は？~読書~水泳~料理~ダンス~likes reading books です。`, `Tom works at a cafe. He starts at nine every morning.~トムが仕事を始める時刻は？~午前9時~午前7時~正午~午後6時~starts at nine every morning に注目。;The library is closed today. It will open again tomorrow.~図書館はいつ再開する？~明日~今日~来週~昨日~tomorrow は明日。`, `We reserved a table for three, but one friend cannot come. I will call the restaurant.~電話する主な理由は？~予約人数の変更~道を尋ねる~料理への苦情~開店時間の確認~1人が来られなくなりました。;The museum is free on Fridays. On other days, adults pay ten dollars.~金曜日の入館料は？~無料~10ドル~5ドル~20ドル~free on Fridays です。`, `The team postponed the launch because tests revealed a safety issue.~発売延期の理由は？~安全上の問題~予算不足~悪天候~人員不足~because 以下が延期の理由です。;The reviewer recommends a different model because the battery is unreliable.~別の機種を勧める理由は？~電池の信頼性が低い~本体が高価~画面が暗い~重すぎる~unreliable は信頼できないという意味です。`],
 o:[`私は音楽が好きです。~I /like /music.~I like music.~主語→動詞→目的語。;これは私の本です。~This /is /my /book.~This is my book.~be動詞と所有格 my。`, `彼女は今勉強しています。~She /is /studying /now.~She is studying now.~be + -ing の現在進行形。;あなたはどこに住んでいますか？~Where /do /you /live?~Where do you live?~疑問詞 + do you + 動詞原形。`, `私は3年間英語を勉強しています。~I /have /studied /English /for /three years.~I have studied English for three years.~継続を表す現在完了。;駅までの行き方を教えてください。~Please /tell /me /how /to /get /to the station.~Please tell me how to get to the station.~how to get to ... は行き方。`, `時間があれば参加するのに。~If /I /had /time, /I /would /join.~If I had time, I would join.~仮定法過去は If + 過去形、would + 原形。;彼女は問題を解決しただけでなく原因も説明した。~She /not only /solved /the problem /but also /explained /the cause.~She not only solved the problem but also explained the cause.~not only ... but also ...。`]
 },
 ko:{
 v:[`안녕하세요=こんにちは;감사합니다=ありがとうございます;물=水;밥=ご飯;책=本;고양이=猫;개=犬;친구=友達;오늘=今日;내일=明日;학교=学校;커피=コーヒー`, `아침=朝;저녁=夕方;지하철=地下鉄;역=駅;표=切符;회사=会社;바쁘다=忙しい;어제=昨日;시간=時間;음식=食べ物;주말=週末;날씨=天気`, `예약=予約;방향=方向;짐=荷物;추천하다=おすすめする;경험=経験;이유=理由;보통=普段;가끔=時々;벌써=すでに;필요하다=必要だ;가능하다=可能だ;도착하다=到着する`, `그러나=しかし;그럼에도=それにもかかわらず;만약=もし;기회=機会;결정=決定;증거=証拠;장점=長所;우려=懸念;가정=仮定;결과=結果;신뢰하다=信頼する;효율적=効率的`],
 g:[`저는 학생___.~입니다~있습니다~갑니다~합니다~学生ですは 학생입니다。;학교___ 가요.~에~를~은~의~移動先は 에。;물___ 마셔요.~을~를~이~가~パッチムのある 물 には 을。;책___ 있어요.~이~가~를~에~パッチムのある 책 には 이。`, `어제 영화를 ___.~봤어요~봐요~볼 거예요~보세요~어제 に合わせて過去形。;내일 학교에 ___.~갈 거예요~갔어요~갑니다만~가던~未来の予定は 갈 거예요。;지금 밥을 ___.~먹고 있어요~먹었어요~먹을 거예요~먹습니다만~動作進行は -고 있어요。;커피를 ___ 않아요.~마시지~마셔서~마시고~마실~-지 않아요 は否定形。`, `비가 오___ 집에 있을 거예요.~면~고~지만~에서~条件は -면。;한국어를 잘하___ 싶어요.~고~서~면~지만~-고 싶어요 は〜したい。;버스가 늦___ 택시를 탔어요.~어서~지만~거나~면~原因の -어서。;선생님께서 지금 ___.~계세요~있어~있니~있는~尊敬の表現で 계세요。`, `아무리 바쁘___ 운동을 해요.~더라도~어서~고~면~譲歩の -더라도。;시간이 있___ 같이 갈 텐데요.~으면~어서~지만~다가~パッチムがある 있다 には -으면。;문제가 해결되___ 알려 주세요.~면~지만~고~기~条件は -면。;그 사실을 알___ 좋았을 텐데요.~았으면~고~는~자~過去の仮定です。`],
 l:[`안녕하세요. 반갑습니다.=こんにちは。お会いできてうれしいです。;저는 학생이에요.=私は学生です。;물을 주세요.=水をください。;책을 읽어요.=本を読みます。`, `내일 시간이 있어요?=明日時間がありますか？;지하철역이 어디예요?=地下鉄の駅はどこですか？;어제 영화를 봤어요.=昨日映画を見ました。;지금 조금 바빠요.=今、少し忙しいです。`, `예약을 변경하고 싶어요.=予約を変更したいです。;이 근처에 호텔이 있나요?=この近くにホテルはありますか？;벌써 숙제를 끝냈어요.=もう宿題を終えました。;시간이 더 필요해요.=もっと時間が必要です。`, `증거가 충분하지 않습니다.=証拠が十分ではありません。;효율적인 방법을 찾아야 해요.=効率的な方法を探す必要があります。;시간이 없다면 내일 해도 돼요.=時間がなければ明日してもいいです。;이 결정에는 장점도 있습니다.=この決定には長所もあります。`],
 r:[`민수는 학생입니다. 매일 학교에 갑니다.~ミンスの職業は？~学生~医師~料理人~運転手~학생 は学生です。;오늘은 월요일입니다. 지수는 책을 읽어요.~ジスは何をしますか？~本を読む~映画を見る~走る~料理する~책을 읽어요 とあります。`, `수진은 아침 일곱 시에 일어납니다. 여덟 시에 학교에 갑니다.~スジンが学校へ行く時刻は？~8時~7時~9時~6時~여덟 시 は8時。;도서관은 오늘 쉽니다. 내일 다시 엽니다.~図書館の再開はいつ？~明日~今日~来週~昨日~내일 は明日。`, `민지는 친구와 식당에 가려고 했지만 친구가 아파서 혼자 갔어요.~ミンジが一人で行った理由は？~友達の体調不良~道が分からない~雨が降った~予約がない~친구가 아파서 とあります。;이번 주 금요일에는 박물관 입장료가 무료입니다.~無料で入れるのは？~金曜日~月曜日~土曜日~水曜日~금요일 は金曜日。`, `회사는 안전 문제를 발견해서 새 제품 출시를 연기했습니다.~新製品を延期した理由は？~安全上の問題~予算不足~祝日~材料不足~안전 문제 は安全問題。;이 제품은 가격이 저렴하지만 배터리 성능이 안정적이지 않습니다.~製品の弱点は？~電池性能が不安定~価格が高い~画面が小さい~重すぎる~안정적이지 않습니다 は安定しないという意味。`],
 o:[`私は学生です。~저는 /학생이에요.~저는 학생이에요.~저는 は「私は」。;水をください。~물을 /주세요.~물을 주세요.~목적격 조사 을。`, `私は昨日映画を見ました。~저는 /어제 /영화를 /봤어요.~저는 어제 영화를 봤어요.~過去形 봤어요。;明日学校へ行きます。~내일 /학교에 /갈 거예요.~내일 학교에 갈 거예요.~未来表現 -ㄹ 거예요。`, `韓国語を勉強したいです。~한국어를 /공부하고 /싶어요.~한국어를 공부하고 싶어요.~動詞 -고 싶어요。;雨が降れば家にいます。~비가 /오면 /집에 /있을 거예요.~비가 오면 집에 있을 거예요.~条件の -면。`, `時間があれば一緒に行けるのに。~시간이 /있으면 /같이 /갈 텐데요.~시간이 있으면 같이 갈 텐데요.~仮定の -으면。;難しくても挑戦します。~어렵더라도 /도전할 거예요.~어렵더라도 도전할 거예요.~譲歩の -더라도。`]
 },
 zh:{
 v:[`你好=こんにちは;谢谢=ありがとう;水=水;米饭=ご飯;书=本;猫=猫;狗=犬;朋友=友達;今天=今日;明天=明日;学校=学校;咖啡=コーヒー`, `早上=朝;晚上=夜;地铁=地下鉄;车站=駅;车票=切符;公司=会社;忙=忙しい;昨天=昨日;时间=時間;食物=食べ物;周末=週末;天气=天気`, `预约=予約;方向=方向;行李=荷物;推荐=おすすめする;经验=経験;原因=理由;通常=普段;有时候=時々;已经=すでに;需要=必要とする;可以=できる;到达=到着する`, `但是=しかし;尽管=〜にもかかわらず;如果=もし;机会=機会;决定=決定;证据=証拠;优点=長所;担忧=懸念;假设=仮定;结果=結果;可靠=信頼できる;效率=効率`],
 g:[`我___学生。~是~有~在~会~AはBだ、には 是。;我___一本书。~有~是~在~会~所有を表す 有。;她___喝茶。~喜欢~是~有~在~好きだには 喜欢。;你___日本人吗？~是~有~会~给~判断文の疑問形は 是 ... 吗。`, `我昨天___电影。~看了~看~要看~正在看~完了動作を示す 了。;他___学习中文。~正在~已经了~还了~过了~進行中は 正在。;明天我___去北京。~要~了~过~着~未来の意図は 要。;这个比那个___。~大~最大~很的~大的~比較文 比 ... 大。`, `我___去过上海。~已经~正在了~会了~得了~経験を示す 过 を伴う表現です。;___下雨，我们就不去了。~如果~虽然~但是~因为~条件は 如果。;我把书___桌子上了。~放在~放得~给~比~把構文で位置を指定する 放在。;你知道他___在哪里吗？~住~住了的~是住~在住了~埋め込み疑問の中で 住在哪里。`, `___天气不好，我们还是出发了。~虽然~因为~如果~为了~逆接の 〜にもかかわらず は 虽然。;我宁愿走路，___坐出租车。~也不~所以~因为~或者~宁愿 A 也不 B は「BよりAしたい」。;只有认真准备，___能成功。~才~就了~得~过~只有 ... 才 ... は必要条件。;这件事值得我们认真___。~考虑~考虑了过~考虑得~考虑在~值得 + 動詞は「〜する価値がある」。`],
 l:[`你好，很高兴认识你。=こんにちは、お会いできてうれしいです。;我是学生。=私は学生です。;请给我一杯水。=水を一杯ください。;我喜欢看书。=私は読書が好きです。`, `你明天有时间吗？=明日は時間がありますか？;地铁站在哪里？=地下鉄の駅はどこですか？;我昨天看了电影。=私は昨日映画を見ました。;我现在有点忙。=今、少し忙しいです。`, `我想更改预约。=予約を変更したいです。;这附近有酒店吗？=この近くにホテルはありますか？;我已经做完作业了。=私はすでに宿題を終えました。;我需要更多时间。=もっと時間が必要です。`, `我们需要更可靠的证据。=もっと信頼できる証拠が必要です。;这个决定可能带来后果。=この決定は影響をもたらす可能性があります。;如果不下雨，活动就会举行。=雨が降らなければイベントは開催されます。;效率并不是唯一的问题。=効率だけが問題なのではありません。`],
 r:[`小明是一名学生。他每天去学校。~小明は何をしていますか？~学生~医者~先生~料理人~学生 とあります。;小丽喜欢猫。她有两只猫。~小丽が飼っている猫は何匹？~2匹~1匹~3匹~4匹~两只 は2匹。`, `我每天七点起床，八点去学校。~学校へ出発する時刻は？~8時~7時~9時~6時~八点 は8時。;图书馆今天不开门，明天再开放。~図書館が再開するのは？~明日~今日~来週~昨日~明天 は明日。`, `我们原来订了三个人的位子，但是一位朋友不能来了。~変更すべき予約人数は？~3人から2人~2人から3人~3人から4人~変更不要~一位朋友不能来了。;这个博物馆每周五免费开放。~無料入館できる曜日は？~金曜日~月曜日~土曜日~火曜日~周五 は金曜日。`, `由于检测发现了安全问题，公司决定推迟产品发布。~発売延期の理由は？~安全上の問題~予算不足~天気~人員不足~安全问题 が原因。;这个设备虽然价格不高，但是电池不太可靠。~この製品の弱点は？~電池の信頼性~価格の高さ~サイズの大きさ~画面の暗さ~电池不太可靠 です。`],
 o:[`私は学生です。~我 /是 /学生。~我是学生。~主語 + 是 + 名詞。;私は水を飲みます。~我 /喝 /水。~我喝水。~主語 + 動詞 + 目的語。`, `私は昨日映画を見ました。~我 /昨天 /看了 /电影。~我昨天看了电影。~时间副词 + 了。;彼女は中国語を勉強しています。~她 /正在 /学习 /中文。~她正在学习中文。~正在 は進行。`, `私はすでに宿題を終えました。~我 /已经 /做完 /作业了。~我已经做完作业了。~已经 ... 了。;雨が降れば行きません。~如果 /下雨，/我 /就不去。~如果下雨，我就不去。~如果 ... 就 ...。`, `天気は悪いけれど私たちは出発しました。~虽然 /天气不好，/我们 /还是 /出发了。~虽然天气不好，我们还是出发了。~虽然 ... 还是 ...。;信頼できる証拠が必要です。~我们 /需要 /可靠的 /证据。~我们需要可靠的证据。~需要 は「必要とする」。`]

// 3言語×10レベル×3追加セクション。編集元は extended_lessons.tsv。
const EXTRA_SECTIONS={"en":[[{"title":"主語と代名詞","why":"英文では「誰について話すか」を先に示すことが基本です。I、you、he、she、we、they を使い分けます。","pattern":"I / you / he / she / we / they","tip":"人名や複数の人を代名詞に置き換えてみましょう。","examples":["I am ready.=私は準備できています。","You are kind.=あなたは親切です。","He is my brother.=彼は私の兄（弟）です。","They are my classmates.=彼らは私のクラスメートです。"]},{"title":"身の回りのもの","why":"身近な名詞を覚えると、This is や That is で簡単な説明ができます。","pattern":"This is a ... / That is a ...","tip":"近くのものには this、離れたものには that を使います。","examples":["This is a pen.=これはペンです。","That is a chair.=あれは椅子です。","I have a phone.=私は電話を持っています。","The door is open.=ドアが開いています。"]},{"title":"短い質問と返事","why":"be 動詞の質問は主語の前に be 動詞を置きます。返事でも同じ be 動詞を使います。","pattern":"Are you ...? / Is this ...?","tip":"Yes と No の返事では主語と動詞も合わせましょう。","examples":["Are you a student?=あなたは学生ですか？","Yes, I am.=はい、そうです。","Is this your bag?=これはあなたのかばんですか？","No, it is not.=いいえ、違います。"]}],[{"title":"家族と所有","why":"「私の」「彼女の」などの所有を表す語を覚えます。名詞の前に置いて使います。","pattern":"my / your / his / her / our / their","tip":"he と his、she と her を混同しないようにします。","examples":["This is my sister.=こちらは私の姉（妹）です。","His father is a doctor.=彼の父は医者です。","Her name is Mina.=彼女の名前はミナです。","Our house is small.=私たちの家は小さいです。"]},{"title":"時間と曜日","why":"時間や曜日を答える練習をします。時刻には at、曜日には on を使うのが基本です。","pattern":"at seven / on Monday","tip":"in the morning、in the afternoon も一緒に覚えましょう。","examples":["It is seven o'clock.=7時です。","I wake up at six.=私は6時に起きます。","We meet on Friday.=私たちは金曜日に会います。","The class starts at nine.=授業は9時に始まります。"]},{"title":"食べ物と買い物","why":"食べ物の名前と、ほしい物を簡単に伝える表現を練習します。","pattern":"I want ... / How much is ...?","tip":"数えられる名詞の単数形には a / an が必要になることがあります。","examples":["I want an apple.=リンゴが1個ほしいです。","We need some bread.=パンが少し必要です。","How much is this?=これはいくらですか？","I would like tea.=紅茶をいただきたいです。"]}],[{"title":"習慣と頻度","why":"現在形は習慣も表します。always、usually、sometimes、never で頻度を調整します。","pattern":"usually + 動詞 / be + often","tip":"一般動詞の前、be 動詞の後に置くことが多いです。","examples":["I usually study at night.=私は普段夜に勉強します。","She always walks to school.=彼女はいつも徒歩で通学します。","We sometimes eat out.=私たちは時々外食します。","He is often busy.=彼はよく忙しくしています。"]},{"title":"予定と約束","why":"日付、曜日、開始時刻を伝えて予定を組み立てます。未来の予定には現在進行形も使えます。","pattern":"I'm meeting ... tomorrow","tip":"進行形を予定に使えるのは、具体的な手配のある場合が多いです。","examples":["I am meeting Tom tomorrow.=私は明日トムに会う予定です。","The train leaves at eight.=列車は8時に出ます。","We have a meeting on Tuesday.=火曜日に会議があります。","Are you free this weekend?=今週末は空いていますか？"]},{"title":"道案内と場所","why":"場所を示す前置詞と命令文で道を説明します。","pattern":"turn left / next to / across from","tip":"go straight は「まっすぐ進む」、turn right は「右に曲がる」です。","examples":["Go straight for two blocks.=2区画まっすぐ進んでください。","Turn left at the bank.=銀行で左に曲がってください。","The shop is next to the station.=店は駅の隣です。","The park is across from the library.=公園は図書館の向かいです。"]}],[{"title":"過去形との違い","why":"過去の一点を述べるときは過去形、今までの経験や結果を述べるときは現在完了形を使い分けます。","pattern":"I went ... yesterday / I have been ...","tip":"yesterday と ever の役割の違いを確認しましょう。","examples":["I went to Kyoto last year.=私は昨年京都へ行きました。","I have been to Kyoto twice.=私は京都へ2回行ったことがあります。","She lost her key yesterday.=彼女は昨日鍵をなくしました。","She has lost her key.=彼女は鍵をなくしてしまいました。"]},{"title":"比較を詳しく話す","why":"比較級や最上級に加え、as ... as を使うと同程度を表せます。","pattern":"as + 形容詞 + as","tip":"less than は「〜ほどではない」という比較に使えます。","examples":["This task is harder than that one.=この課題はあの課題より難しいです。","He runs as fast as I do.=彼は私と同じくらい速く走ります。","This one is less expensive.=こちらの方が安いです。","It is the least risky option.=それは最も危険性が低い選択肢です。"]},{"title":"人と物を説明する","why":"関係代名詞を使うと、人や物をひとつの文で詳しく説明できます。","pattern":"the person who ... / the thing that ...","tip":"説明部分の主語・目的語の位置を確認しましょう。","examples":["The woman who called is my teacher.=電話してきた女性は私の先生です。","This is a tool that saves time.=これは時間を節約できる道具です。","I know the place where he works.=彼の働く場所を知っています。","The laptop I bought is light.=私が買ったノートPCは軽いです。"]}],[{"title":"許可と能力の違い","why":"can は能力にも許可にも使いますが、may はより形式的な許可を求める場面で使われます。","pattern":"Can I ...? / May I ...?","tip":"依頼するときの can と能力を表す can を区別しましょう。","examples":["Can you swim?=あなたは泳げますか？","May I ask a question?=質問してもよろしいでしょうか？","You may leave now.=もう退出しても構いません。","I cannot attend tomorrow.=私は明日出席できません。"]},{"title":"助言を比べる","why":"should、had better、must を使い分けると、助言や義務の強さを伝えられます。","pattern":"should / had better / must","tip":"mustn't は「禁止」、don't have to は「不要」です。","examples":["You should get some rest.=少し休んだほうがいいです。","You had better leave early.=早めに出たほうがいいです。","You must not enter here.=ここに入ってはいけません。","You don't have to wait.=待つ必要はありません。"]},{"title":"希望と計画","why":"want to、plan to、intend to は似ていますが意図の強さや具体性が違います。","pattern":"want to / plan to / intend to","tip":"動詞の後ろに to 不定詞を置きます。","examples":["I want to learn Korean.=韓国語を学びたいです。","We plan to move next year.=私たちは来年引っ越す予定です。","She intends to apply.=彼女は応募するつもりです。","I hope to see you again.=またお会いしたいです。"]}],[{"title":"原因と結果","why":"because、therefore、as a result で理由と結果の関係を説明できます。","pattern":"because + 文 / therefore, + 文","tip":"接続詞と接続副詞は文のつなげ方が異なります。","examples":["The roads were closed because of snow.=雪のため道路が閉鎖されました。","He was ill, so he stayed home.=彼は病気だったので家にいました。","The test failed. Therefore, we repeated it.=実験は失敗したため、やり直しました。","As a result, sales decreased.=その結果、売上が減少しました。"]},{"title":"譲歩と対比","why":"although、however、whereas は、予想に反する事実や二つの事柄の対照を表します。","pattern":"although / whereas / however","tip":"although と but をひとつの従属節構造で重ねないようにします。","examples":["Although it was late, she continued.=遅い時間だったが彼女は続けました。","The first plan is cheap, whereas the second is fast.=第一案は安い一方、第二案は速いです。","However, there is another problem.=しかし別の問題があります。","Even though I was tired, I worked.=疲れていたけれど働きました。"]},{"title":"自分の意見を述べる","why":"意見を述べるときは、主張だけでなく理由や条件も加えると伝わりやすくなります。","pattern":"I think ... because ...","tip":"事実と自分の考えは区別して述べましょう。","examples":["I think this method is useful.=この方法は役立つと思います。","In my opinion, the risk is too high.=私の考えではリスクが高すぎます。","I agree with your point.=あなたの意見に賛成です。","I disagree for two reasons.=二つの理由から反対です。"]}],[{"title":"受動態の時制","why":"受動態は時制に応じて be 動詞などを変化させます。","pattern":"was built / is being built / has been built","tip":"受動態でも「いつ起きたか」を表現できます。","examples":["The bridge was built in 1990.=橋は1990年に建設されました。","The bridge is being repaired.=橋は修理中です。","The bridge has been repaired.=橋の修理は済みました。","The plan will be announced tomorrow.=計画は明日発表されます。"]},{"title":"時間の前後関係","why":"過去完了はある過去時点より前の出来事を示します。before、after、by the time と組み合わせます。","pattern":"by the time + 過去形, had + 過去分詞","tip":"過去の出来事の順番を意識しましょう。","examples":["By the time I arrived, she had left.=私が着いた頃には彼女は去っていました。","He had finished before noon.=彼は正午前に終えていました。","After we had eaten, we left.=食事を終えた後、出発しました。","I had never seen that before.=それ以前には見たことがありませんでした。"]},{"title":"人の発言を伝える","why":"人の言葉を間接話法で伝えるときは、時制や代名詞を調整する場合があります。","pattern":"said that ... / told me that ...","tip":"tell は「誰に」を表す目的語を取りやすいです。","examples":["She said that she was tired.=彼女は疲れていると言いました。","He told me that he was busy.=彼は忙しいと私に言いました。","They asked whether I was ready.=彼らは準備ができたか尋ねました。","She explained why she had left.=彼女はなぜ去ったか説明しました。"]}],[{"title":"仮定法と現実","why":"現実と違う条件を仮定するとき、現在の話でも if 節に過去形を使います。","pattern":"If I were ..., I would ...","tip":"条件の非現実性を表すための過去形です。","examples":["If I were rich, I would travel more.=お金持ちならもっと旅行するのに。","If he knew the answer, he would tell us.=答えを知っていれば彼は教えてくれるでしょうに。","I would buy it if it were cheaper.=もっと安ければ買うのに。","If she had time, she could join us.=時間があれば彼女も参加できるのに。"]},{"title":"過去の条件を考える","why":"起こらなかった過去を振り返り、結果も仮定する表現を練習します。","pattern":"If + had + p.p., would have + p.p.","tip":"現実に起きた出来事とは区別しましょう。","examples":["If I had studied, I would have passed.=勉強していれば合格したのに。","If they had called, we could have helped.=電話してくれれば手伝えたのに。","She would have come if she had known.=知っていれば彼女は来たでしょうに。","We might have missed the train.=私たちは電車に乗り遅れていたかもしれません。"]},{"title":"推量の確かさ","why":"must、might、can't と現在・過去の形で、証拠からの推量の確かさを調整します。","pattern":"must be / might have + p.p.","tip":"推量の must は義務ではなく「きっと〜だ」を示します。","examples":["He must be at home.=彼は家にいるに違いありません。","She might be asleep.=彼女は眠っているかもしれません。","That can't be true.=それが本当のはずはありません。","He must have forgotten.=彼は忘れたに違いありません。"]}],[{"title":"主張と証拠","why":"主張を強くするより、どの程度証拠が支持しているかを示す語の選択が重要です。","pattern":"evidence suggests / data indicate","tip":"indicate や suggest と prove は意味が異なります。","examples":["The data indicate a gradual increase.=データは緩やかな増加を示しています。","The findings suggest a connection.=結果は関連を示唆しています。","The claim lacks sufficient evidence.=その主張には十分な証拠がありません。","A single example cannot establish a trend.=一例だけでは傾向を確立できません。"]},{"title":"反論を公平に扱う","why":"反対意見を理解したうえで、限定や反証を示す言い方を練習します。","pattern":"although / nevertheless / in contrast","tip":"極端な断定よりも根拠に基づく表現を使いましょう。","examples":["Critics argue that the cost is excessive.=批判者は費用が過大だと主張しています。","Nevertheless, the benefits may outweigh it.=それでも利益がそれを上回るかもしれません。","In contrast, the second approach is flexible.=対照的に第二の方法は柔軟です。","This objection deserves consideration.=この反論は検討する価値があります。"]},{"title":"レポートの文章","why":"客観的な文章では、方法・結果・解釈を順番に整理します。","pattern":"method → results → interpretation","tip":"観察結果と、その結果の意味づけを混同しないことが重要です。","examples":["The study examined three groups.=その研究は3群を調べました。","Participants completed a questionnaire.=参加者は質問票に回答しました。","The results differed between groups.=結果は群によって異なりました。","Further analysis is required.=さらなる分析が必要です。"]}],[{"title":"倒置で強調する","why":"否定語や限定語を文頭に置くと、助動詞と主語が倒置することがあります。","pattern":"Never have I ... / Only then did ...","tip":"倒置は強調や文章のリズムのために使われます。","examples":["Never have I faced such a dilemma.=このようなジレンマに直面したことはありません。","Only then did I realize the problem.=その時になって初めて問題に気づきました。","Under no circumstances should you proceed.=いかなる状況でも進めてはいけません。","Seldom do we see this pattern.=このパターンはめったに見られません。"]},{"title":"断定を避ける表現","why":"学術的な文章では、根拠の強さに合わせて可能性や限定を示します。","pattern":"may / appears to / not necessarily","tip":"可能性を述べることと、断定することは異なります。","examples":["This may account for the difference.=これが違いを説明するかもしれません。","The intervention appears to be effective.=その介入は効果的であるように見えます。","The results are not necessarily generalizable.=その結果は必ずしも一般化できません。","The evidence remains inconclusive.=証拠はまだ結論を出すには不十分です。"]},{"title":"高度な読解の論理","why":"文章の主張・制約・推論を分けて読み、書かれていない結論を勝手に加えない練習です。","pattern":"claim → qualification → implication","tip":"可能性を示す文から必然的な結論を導かないようにします。","examples":["The correlation alone does not establish causation.=相関だけでは因果関係を証明しません。","An alternative explanation remains possible.=別の説明があり得ます。","The conclusion holds only under these assumptions.=この結論はこれらの前提の下でのみ成り立ちます。","The passage leaves the question unresolved.=文章はその問題に結論を出していません。"]}]],"ko":[[{"title":"基本子音の形","why":"ハングルは子音と母音を組み合わせて音節を作ります。基本子音の音の違いを意識します。","pattern":"ㄱ / ㄴ / ㄷ / ㄹ / ㅁ","tip":"日本語のカナ表記は近似であり、韓国語の発音と完全には一致しません。","examples":["가=（音節）カに近い音","나=（音節）ナに近い音","다=（音節）タに近い音","마=（音節）マに近い音"]},{"title":"基本母音を覚える","why":"ハングルの母音には口の開き方や唇の形による違いがあります。","pattern":"ㅏ / ㅓ / ㅗ / ㅜ","tip":"ㅓとㅗは日本語の「オ」と同じ音ではありません。","examples":["아=アに近い母音","어=オに近いが唇を丸めない母音","오=唇を丸めるオに近い母音","우=ウに近い母音"]},{"title":"すぐ使える言葉","why":"短い定型表現を使って相手に意思を伝えます。","pattern":"네 / 아니요 / 괜찮아요","tip":"丁寧な会話では表情や声の調子も大切です。","examples":["네, 맞아요.=はい、そうです。","아니요, 아니에요.=いいえ、違います。","괜찮아요.=大丈夫です。","죄송합니다.=申し訳ありません。"]}],[{"title":"主題と主語","why":"은/는 は話題、이/가 は主語を示します。文脈に応じて焦点が変わります。","pattern":"은/는 vs 이/가","tip":"パッチムの有無で助詞の形が変わります。","examples":["저는 학생이에요.=私は学生です。","누가 왔어요?=誰が来ましたか？","친구가 왔어요.=友達が来ました。","오늘은 날씨가 좋아요.=今日は天気がいいです。"]},{"title":"位置と存在","why":"있어요/없어요 と位置の語を使って物の場所を説明します。","pattern":"위에 / 아래에 / 옆에","tip":"場所を表す名詞のあとに 에 を付けることが多いです。","examples":["책이 책상 위에 있어요.=本が机の上にあります。","고양이가 의자 아래에 있어요.=猫が椅子の下にいます。","학교가 집 옆에 있어요.=学校は家の隣にあります。","시간이 없어요.=時間がありません。"]},{"title":"否定の作り方","why":"안 と 못 は、しない意思とできない事情を区別する際によく使われます。","pattern":"안 + 動詞 / 못 + 動詞","tip":"文脈により、안 は単純な否定、못 は能力や状況による不可能を示します。","examples":["저는 커피를 안 마셔요.=私はコーヒーを飲みません。","오늘은 못 가요.=今日は行けません。","그건 제 것이 아니에요.=それは私の物ではありません。","지금 바쁘지 않아요.=今は忙しくありません。"]}],[{"title":"過去の出来事","why":"-았어요/-었어요 は過去を表します。動詞の語幹によって形が変わります。","pattern":"가다→갔어요 / 먹다→먹었어요","tip":"昨日や先週と組み合わせて使います。","examples":["어제 영화를 봤어요.=昨日映画を見ました。","지난주에 친구를 만났어요.=先週友達に会いました。","아침을 먹었어요.=朝食を食べました。","어디에 갔어요?=どこへ行きましたか？"]},{"title":"未来と予定","why":"-(으)ㄹ 거예요 を使って未来や予定を話します。","pattern":"가다→갈 거예요 / 먹다→먹을 거예요","tip":"パッチムの有無によって形が変わります。","examples":["내일 공부할 거예요.=明日勉強するつもりです。","주말에 쉴 거예요.=週末に休むつもりです。","비가 올 거예요.=雨が降るでしょう。","언제 출발할 거예요?=いつ出発する予定ですか？"]},{"title":"数字と時間","why":"漢数詞と固有数詞を使う場面を区別して、時間や数量を伝えます。","pattern":"세 시 / 삼 분","tip":"時刻の「〜時」には固有数詞、「〜分」には漢数詞を使います。","examples":["세 시예요.=3時です。","삼십 분 걸려요.=30分かかります。","사과 두 개 주세요.=リンゴを2個ください。","오늘은 십일월이에요.=今は11月です。"]}],[{"title":"敬語の基本","why":"相手への敬意を表す -(으)세요 や 주무시다 などを覚えます。","pattern":"-(으)세요 / 주무시다","tip":"敬語は相手との関係や場面によって使い分けます。","examples":["여기 앉으세요.=こちらにお座りください。","선생님이 오세요.=先生がいらっしゃいます。","할머니가 주무세요.=祖母はお休みになっています。","천천히 말씀하세요.=ゆっくりお話しください。"]},{"title":"理由をつなぐ","why":"-아서/-어서 と -(으)니까 は理由を表します。命令・勧誘との相性に違いがあります。","pattern":"-아서/-어서 / -(으)니까","tip":"-(으)니까 は理由を説明して依頼する文にも使いやすいです。","examples":["비가 와서 집에 있었어요.=雨が降ったので家にいました。","피곤해서 일찍 잤어요.=疲れて早く寝ました。","늦었으니까 빨리 가세요.=遅れたので急いでください。","배가 고파서 밥을 먹었어요.=お腹が空いたので食事をしました。"]},{"title":"対比と逆接","why":"-지만 や 그런데 を使って、二つの状況を対比させます。","pattern":"-지만 / 그런데","tip":"しかしを示す語でも文中の位置や使い方が違います。","examples":["작지만 편해요.=小さいですが快適です。","비싸지만 맛있어요.=高いけれどおいしいです。","가고 싶지만 시간이 없어요.=行きたいですが時間がありません。","날씨는 좋은데 바람이 강해요.=天気はよいですが風が強いです。"]}],[{"title":"許可と禁止","why":"-아도/-어도 돼요 と -(으)면 안 돼요 を使い分けます。","pattern":"-아도 돼요 / -(으)면 안 돼요","tip":"丁寧な言い方は場面に応じて調整します。","examples":["여기 앉아도 돼요?=ここに座ってもいいですか？","사진을 찍으면 안 돼요.=写真を撮ってはいけません。","지금 들어가도 돼요.=今入ってもいいです。","문을 열어도 돼요?=ドアを開けてもいいですか？"]},{"title":"義務と必要","why":"-아야/-어야 해요 で必要な行動や義務を表します。","pattern":"공부해야 해요 / 가야 해요","tip":"안 해도 돼요 は「しなくてもよい」という意味です。","examples":["숙제를 해야 해요.=宿題をしなければなりません。","지금 출발해야 해요.=今出発しなければなりません。","기다리지 않아도 돼요.=待たなくても大丈夫です。","약을 먹어야 해요.=薬を飲まなければなりません。"]},{"title":"経験を伝える","why":"-(으)ㄴ 적이 있어요 は経験の有無を伝えます。","pattern":"가 본 적이 있어요","tip":"-아/어 보다 と組み合わせて経験を示すことがあります。","examples":["한국에 가 본 적이 있어요.=韓国へ行ったことがあります。","이 음식을 먹어 봤어요.=この料理を食べてみました。","그 사람을 만난 적이 없어요.=その人に会ったことがありません。","영화를 본 적이 있어요?=映画を見たことがありますか？"]}],[{"title":"現実的な条件","why":"-(으)면 は「〜なら」「〜すると」を表します。","pattern":"시간이 있으면 ...","tip":"条件に加えて、意図や結果も一緒に伝えます。","examples":["시간이 있으면 전화하세요.=時間があれば電話してください。","비가 오면 집에 있을 거예요.=雨が降れば家にいるつもりです。","돈이 있으면 살게요.=お金があれば買います。","어려우면 질문하세요.=難しければ質問してください。"]},{"title":"推量と可能性","why":"-(으)ㄹ 것 같아요 は推量や予想をやわらかく述べる表現です。","pattern":"비가 올 것 같아요","tip":"推量を断定と混同しないようにしましょう。","examples":["내일 추울 것 같아요.=明日は寒そうです。","그 사람은 바쁠 것 같아요.=その人は忙しそうです。","조금 늦을 것 같아요.=少し遅れそうです。","문제가 있을 것 같아요.=問題がありそうです。"]},{"title":"順序を説明する","why":"-고 나서 や -기 전에 を使い、行動の順番を伝えます。","pattern":"-고 나서 / -기 전에","tip":"時間順序が意味に影響するため順番を正確に言いましょう。","examples":["밥을 먹고 나서 공부했어요.=食事をしてから勉強しました。","자기 전에 책을 읽어요.=寝る前に本を読みます。","숙제를 끝낸 후에 쉬었어요.=宿題を終えた後に休みました。","출발하기 전에 확인하세요.=出発する前に確認してください。"]}],[{"title":"間接話法の入口","why":"他人の発言を -다고 해요 などで伝えます。","pattern":"바쁘다고 해요 / 간다고 해요","tip":"形容詞と動詞では引用形の作り方が異なります。","examples":["친구가 바쁘다고 해요.=友達は忙しいと言っています。","내일 온다고 했어요.=明日来ると言いました。","좋다고 생각해요.=よいと思います。","비가 온다고 들었어요.=雨が降ると聞きました。"]},{"title":"受動の表現","why":"韓国語にも行為を受ける側から説明する表現があります。すべてが同じ形で作れるわけではありません。","pattern":"열리다 / 닫히다 / 보이다","tip":"受動に対応する動詞は語彙として覚える必要がある場合があります。","examples":["문이 열렸어요.=ドアが開きました。","창문이 닫혔어요.=窓が閉まりました。","산이 보여요.=山が見えます。","이 책은 많이 읽혀요.=この本はよく読まれます。"]},{"title":"名詞化と説明","why":"-는 것 で動作を名詞のように扱い、考えや好みを説明します。","pattern":"동사 + 는 것","tip":"日本語の「〜すること」に近い働きです。","examples":["한국어를 배우는 것이 재미있어요.=韓国語を学ぶことは楽しいです。","운동하는 것을 좋아해요.=運動することが好きです。","일찍 일어나는 게 어려워요.=早起きするのは難しいです。","책 읽는 것을 즐겨요.=本を読むことを楽しみます。"]}],[{"title":"仮定的な想像","why":"-(으)ㄴ다면/-는다면 を使うと仮定を明確に表せます。","pattern":"시간이 있다면 ...","tip":"現実の状況から離れた想像にも使われます。","examples":["시간이 더 있다면 좋겠어요.=もっと時間があればいいのに。","제가 왕이라면 바꾸겠어요.=私が王なら変えるでしょう。","다시 시작한다면 다르게 할 거예요.=やり直すなら違う方法にします。","선택할 수 있다면 이것을 고르겠어요.=選べるならこれを選びます。"]},{"title":"後悔と振り返り","why":"-(으)ㄹ 걸 그랬어요 は、やらなかったことへの後悔を表せます。","pattern":"미리 할 걸 그랬어요","tip":"過去を振り返る時の気持ちを含みます。","examples":["좀 더 공부할 걸 그랬어요.=もっと勉強すればよかったです。","일찍 갈 걸 그랬어요.=早く行けばよかったです。","말하지 말 걸 그랬어요.=言わなければよかったです。","우산을 가져올 걸 그랬어요.=傘を持ってくればよかったです。"]},{"title":"譲歩を伝える","why":"-더라도 は「たとえ〜しても」という意味で使います。","pattern":"비가 오더라도 ...","tip":"ある条件でも結論が変わらないことを表します。","examples":["비가 오더라도 갈 거예요.=雨が降っても行くつもりです。","힘들더라도 포기하지 마세요.=大変でも諦めないでください。","늦더라도 연락하세요.=遅くなっても連絡してください。","실패하더라도 다시 해 볼게요.=失敗してもまた試します。"]}],[{"title":"証拠と解釈","why":"学術的な表現では事実と推論を区別します。","pattern":"결과는 ... 시사합니다","tip":"시사하다 は「示唆する」であり、断定とは異なります。","examples":["결과는 가능성을 시사합니다.=結果は可能性を示唆します。","이 가설에는 근거가 필요합니다.=この仮説には根拠が必要です。","자료가 충분하지 않습니다.=資料は十分ではありません。","상관관계는 인과관계를 의미하지 않습니다.=相関関係は因果関係を意味しません。"]},{"title":"反対意見と限定","why":"見解の相違を丁寧に述べ、主張の範囲を限定します。","pattern":"한편 / 반면에 / 다만","tip":"単純な賛否にせず、条件や例外を示しましょう。","examples":["한편 다른 의견도 있습니다.=一方、別の意見もあります。","첫 번째 방법은 빠른 반면에 비쌉니다.=第一の方法は速い反面高いです。","다만 비용을 고려해야 합니다.=ただし費用を考慮する必要があります。","이 주장에는 한계가 있습니다.=この主張には限界があります。"]},{"title":"文章の構成","why":"報告文で研究の目的・方法・結果・結論を整理します。","pattern":"목적 → 방법 → 결과 → 결론","tip":"論理をつなぐ表現を練習します。","examples":["이 연구의 목적은 비교입니다.=この研究の目的は比較です。","세 가지 방법을 사용했습니다.=三つの方法を用いました。","결과에 차이가 나타났습니다.=結果に差が現れました。","추가 연구가 필요합니다.=追加の研究が必要です。"]}],[{"title":"複雑な条件","why":"-는 한、-에 따라、-에 비추어 などを読み分けます。","pattern":"...는 한 / ...에 따라","tip":"条件の範囲や基準を明示する表現です。","examples":["규칙을 지키는 한 문제없습니다.=規則を守る限り問題ありません。","상황에 따라 판단이 달라집니다.=状況によって判断が変わります。","증거에 비추어 결론을 내립니다.=証拠に照らして結論を出します。","조건이 충족되어야 합니다.=条件が満たされなければなりません。"]},{"title":"慎重な断定","why":"-다고 볼 수 있다、-는 것으로 보인다 で結論の確かさを調整します。","pattern":"...라고 볼 수 있습니다","tip":"推測と証明を区別します。","examples":["그렇게 볼 수 있습니다.=そのように見ることができます。","원인이 복합적인 것으로 보입니다.=原因は複合的とみられます。","반드시 그렇다고 할 수는 없습니다.=必ずしもそうとは言えません。","다른 해석도 가능합니다.=別の解釈も可能です。"]},{"title":"高度な文脈理解","why":"接続表現の論理に注目し、結論がどこまで支持されるか判断します。","pattern":"비록 ...지만 / 그럼에도 불구하고","tip":"接続表現が変われば主張の含意も変わります。","examples":["비록 어렵지만 시도하겠습니다.=難しいですが挑戦します。","그럼에도 불구하고 의문은 남습니다.=それにもかかわらず疑問は残ります。","이 결과만으로는 단정할 수 없습니다.=この結果だけでは断定できません。","맥락을 함께 고려해야 합니다.=文脈も合わせて考慮しなければなりません。"]}]],"zh":[[{"title":"ピンインと声調","why":"中国語の音はピンインで表記できます。同じ音節でも声調によって意味が変わることがあります。","pattern":"mā / má / mǎ / mà","tip":"声調は語の意味を区別する大切な情報です。","examples":["妈妈。=お母さん。","马。=馬。","你好。=こんにちは。","谢谢。=ありがとう。"]},{"title":"人称代名詞","why":"私・あなた・彼らなどを表す語と、簡単な主語述語の文を学びます。","pattern":"我 / 你 / 他 / 她 / 我们","tip":"中国語では動詞が人称によって変化しません。","examples":["我是学生。=私は学生です。","你是老师吗？=あなたは先生ですか？","她是我的朋友。=彼女は私の友達です。","我们是同学。=私たちはクラスメートです。"]},{"title":"質問の作り方","why":"「〜ですか」は文末に 吗 を置くと作れる場合が多いです。","pattern":"文 + 吗？","tip":"疑問詞を使う質問では通常 吗 は必要ありません。","examples":["你好吗？=お元気ですか？","你忙吗？=忙しいですか？","你叫什么名字？=お名前は何ですか？","他是谁？=彼は誰ですか？"]}],[{"title":"是・有・在","why":"是 は判断、有 は所有・存在、在 は場所を表す際に使います。","pattern":"是 / 有 / 在","tip":"それぞれの意味に応じて使い分けます。","examples":["我是日本人。=私は日本人です。","我有一本书。=私は本を1冊持っています。","老师在教室。=先生は教室にいます。","这里有一家店。=ここには店が1軒あります。"]},{"title":"所有を表す 的","why":"「誰の」「何の」を表す際に 的 を使います。","pattern":"我的书 / 你的朋友","tip":"家族関係などで 的 を省略する場合もあります。","examples":["这是我的手机。=これは私の携帯電話です。","那是他的车。=あれは彼の車です。","她的名字很好听。=彼女の名前は響きがよいです。","我们的老师来了。=私たちの先生が来ました。"]},{"title":"数字と量詞","why":"中国語では数と名詞の間に量詞を置くことが一般的です。","pattern":"一 + 个 / 本 / 杯 + 名詞","tip":"本は書籍、杯は飲み物などで使います。","examples":["我有三本书。=私は本を3冊持っています。","请给我一杯水。=水を1杯ください。","这里有两个人。=ここには2人います。","我买了一张票。=私は切符を1枚買いました。"]}],[{"title":"完了を表す 了","why":"動作の完了には動詞の後に 了 を置くことがあります。過去形と完全に同じではありません。","pattern":"动词 + 了","tip":"時間や文脈によって 了 の働きは変化します。","examples":["我买了苹果。=私はリンゴを買いました。","他看了电影。=彼は映画を見ました。","我们吃了饭。=私たちは食事をしました。","她写了信。=彼女は手紙を書きました。"]},{"title":"否定の 不 と 没","why":"不 は一般的な否定、没（有）は行為の未完了や経験の否定などで使います。","pattern":"不 + 動詞 / 没(有) + 動詞","tip":"過去の行為を否定するときに 没 を使う例が多いです。","examples":["我不喝咖啡。=私はコーヒーを飲みません。","我昨天没去学校。=私は昨日学校に行きませんでした。","他还没吃饭。=彼はまだ食事をしていません。","这本书不贵。=この本は高くありません。"]},{"title":"時を表す語","why":"中国語では時間を表す語を文頭や主語の後に置きます。","pattern":"我明天去 / 明天我去","tip":"語順の変化を確認しましょう。","examples":["我明天去北京。=私は明日北京に行きます。","昨天他很忙。=昨日彼はとても忙しかったです。","我们下周见面。=私たちは来週会います。","她每天学习中文。=彼女は毎日中国語を勉強します。"]}],[{"title":"比較の 比","why":"二つのものを比較するとき、A 比 B + 形容詞 の形を使えます。","pattern":"A 比 B + 形容詞","tip":"もっと差を表す場合は 更 などを使います。","examples":["今天比昨天冷。=今日は昨日より寒いです。","我的房间比你的大。=私の部屋はあなたの部屋より大きいです。","坐地铁比打车便宜。=地下鉄はタクシーより安いです。","这个问题比那个难。=この問題はあの問題より難しいです。"]},{"title":"経験の 过","why":"動詞の後の 过 は「〜したことがある」という経験を表します。","pattern":"动词 + 过","tip":"否定は 没(有) + 動詞 + 过 などで作ります。","examples":["我去过上海。=私は上海に行ったことがあります。","你吃过这个吗？=あなたはこれを食べたことがありますか？","我没看过那部电影。=私はその映画を見たことがありません。","她学过法语。=彼女はフランス語を学んだことがあります。"]},{"title":"方向と移動","why":"来・去 と方向補語で、動作の向きや移動を表します。","pattern":"走进来 / 拿出去","tip":"話し手の位置を基準に 来 と 去 を使い分けます。","examples":["请进来。=入ってきてください。","他走出去了。=彼は外へ出ていきました。","把书拿过来。=本をこちらに持ってきてください。","她跑上楼去了。=彼女は階上へ駆け上がっていきました。"]}],[{"title":"会・能・可以","why":"会 は習得能力、能 は可能な状況や能力、可以 は許可などの意味を持ちます。","pattern":"会 / 能 / 可以","tip":"同じ「できる」でも場面によって適切な語が異なります。","examples":["我会说一点中文。=私は少し中国語を話せます。","今天我不能去。=今日は私は行けません。","这里可以拍照吗？=ここで写真を撮ってもいいですか？","他会开车。=彼は車を運転できます。"]},{"title":"義務と助言","why":"应该 は助言、必须 は強い必要、不要 は「〜しないで」を表します。","pattern":"应该 / 必须 / 不要","tip":"不必 は「〜する必要はない」です。","examples":["你应该休息。=あなたは休んだほうがいいです。","我们必须准时到。=私たちは時間どおりに着かなければなりません。","不要在这里吸烟。=ここで喫煙しないでください。","你不必担心。=心配する必要はありません。"]},{"title":"ていねいな依頼","why":"请、帮、麻烦 などを使い、相手への依頼を丁寧に伝えます。","pattern":"请 ... / 能帮我 ... 吗？","tip":"お願いを言うときは語調も大切です。","examples":["请再说一遍。=もう一度言ってください。","能帮我一下吗？=ちょっと手伝ってもらえますか？","麻烦你等一下。=少し待っていただけますか？","请给我看一下。=少し見せてください。"]}],[{"title":"理由と結果","why":"因为 ... 所以 ... を使って理由と結果を明示します。","pattern":"因为 A，所以 B","tip":"会話では片方だけを使うこともあります。","examples":["因为下雨，所以我没出去。=雨だったので外出しませんでした。","因为太累了，我早睡了。=疲れすぎたので早く寝ました。","天气很好，所以我们散步了。=天気がよいので散歩しました。","因为堵车，他迟到了。=渋滞のため彼は遅刻しました。"]},{"title":"条件と結果","why":"如果 ... 就 ... は、条件が満たされたときの結果を示します。","pattern":"如果 A，就 B","tip":"条件を示す文はよく主文の前に置きます。","examples":["如果明天下雨，我们就不去。=明日雨なら私たちは行きません。","如果你有时间，就给我打电话。=時間があれば電話してください。","如果便宜一点，我就买。=もう少し安ければ買います。","如果不懂，就问老师。=分からなければ先生に聞いてください。"]},{"title":"逆接と対照","why":"虽然 ... 但是 ... は「〜だけれども」を表します。","pattern":"虽然 A，但是 B","tip":"話し言葉では 但是 を省略する場合もあります。","examples":["虽然很贵，但是质量很好。=高価ですが品質はよいです。","虽然下雨了，他还是出门了。=雨が降りましたが彼は出かけました。","这个方法简单，但是不够准确。=この方法は簡単ですが十分に正確ではありません。","他很年轻，却很有经验。=彼は若いのに経験豊富です。"]}],[{"title":"把構文の基本","why":"把 を使うと目的語にどう働きかけ、どう変化させたかを示せます。","pattern":"把 + 目的語 + 動詞 + 結果","tip":"動詞の後に結果や方向などを伴うことが多いです。","examples":["请把门关上。=ドアを閉めてください。","我把作业写完了。=私は宿題を書き終えました。","他把杯子放在桌上。=彼はコップを机に置きました。","把名字写在这里。=ここに名前を書いてください。"]},{"title":"被構文の基本","why":"被 を使うと、行為を受けた側から出来事を説明できます。","pattern":"主語 + 被 + 行為者 + 動詞","tip":"被 が省略される受動表現もあります。","examples":["我的自行车被偷了。=私の自転車は盗まれました。","窗户被风吹开了。=窓が風で開きました。","这本书被很多人读过。=この本は多くの人に読まれたことがあります。","计划被取消了。=計画は取り消されました。"]},{"title":"結果補語を理解する","why":"動詞の後の 完、懂、到 などで動作の結果を示します。","pattern":"动词 + 完 / 懂 / 到","tip":"動作したことと、目的を達成したことは区別します。","examples":["我看完了这本书。=私はこの本を読み終えました。","你听懂了吗？=聞いて理解できましたか？","我找到了钥匙。=私は鍵を見つけました。","他没有听清楚。=彼ははっきり聞き取れませんでした。"]}],[{"title":"既然で理由を前提に","why":"既然 は、既に認められている事情を前提として結論を述べます。","pattern":"既然 A，就 B","tip":"単なる理由の 因为 とニュアンスが違います。","examples":["既然你来了，就坐一会儿吧。=せっかく来たのだから少し座っていってください。","既然决定了，就开始吧。=決めたのなら始めましょう。","既然时间不够，我们就简化计划。=時間が足りないのだから計画を簡略化しましょう。","既然如此，我同意。=そういうことなら賛成します。"]},{"title":"譲歩の 即使","why":"即使 ... 也 ... は「たとえ〜でも」を意味します。","pattern":"即使 A，也 B","tip":"条件が変わっても主文が成立することを表します。","examples":["即使下雨，我也要去。=雨でも私は行くつもりです。","即使很难，也不要放弃。=難しくても諦めないでください。","即使失败，我们也会再试。=失敗してももう一度試します。","即使没有帮助，他也能完成。=助けがなくても彼は完成できます。"]},{"title":"仮定の 要是","why":"要是 ... 就 ... は会話でよく使う仮定の表現です。","pattern":"要是 A，就 B","tip":"如果 と似ていますが、やや口語的です。","examples":["要是有空，我就去。=暇なら行きます。","要是早知道就好了。=もっと早く知っていればよかったです。","要是你不舒服，就休息吧。=具合が悪いなら休んでください。","要是能重来，我会换一种方法。=やり直せるなら別の方法を選びます。"]}],[{"title":"根拠のある主張","why":"研究や報告では、根拠に基づいて結論の強さを調整します。","pattern":"数据表明 / 研究显示","tip":"表明 と 证明 は主張の強さが違います。","examples":["数据显示差异很明显。=データは差が明らかであることを示しています。","研究表明存在一定联系。=研究は一定の関連があることを示しています。","证据不足以支持结论。=証拠は結論を支持するには不十分です。","相关性不等于因果性。=相関は因果と同じではありません。"]},{"title":"論点を比較する","why":"一方面 ... 另一方面 ... を使って議論の両面を整理します。","pattern":"一方面 A，另一方面 B","tip":"一面的な主張を避けましょう。","examples":["一方面成本低，另一方面效率不高。=一方で費用は低いものの、他方で効率は高くありません。","与此相比，第二种方案更灵活。=これと比較すると第二案はより柔軟です。","不过，这种解释有局限性。=ただし、この説明には限界があります。","我们还需要考虑风险。=リスクも考慮する必要があります。"]},{"title":"報告の構成","why":"研究の目的・方法・結果を順に伝える文章を練習します。","pattern":"目的 → 方法 → 结果","tip":"結果の記述と解釈を分けます。","examples":["本研究的目的是比较两种方法。=本研究の目的は二つの方法の比較です。","我们收集了三组数据。=私たちは3群のデータを集めました。","结果显示两组存在差异。=結果は2群に差があることを示しました。","还需要进一步分析。=さらに分析する必要があります。"]}],[{"title":"高度な条件表現","why":"只有 ... 才 ...、除非 ... 否则 ... など必要条件を読み分けます。","pattern":"只有 A，才 B / 除非 A，否则 B","tip":"必要条件と十分条件を混同しないようにします。","examples":["只有仔细检查，才能发现问题。=注意深く確認して初めて問題を見つけられます。","除非得到许可，否则不能进入。=許可を得ない限り入れません。","只要努力，就有机会。=努力さえすれば機会があります。","无论结果如何，我们都要负责。=結果がどうであれ、責任を持つべきです。"]},{"title":"確実性を調整する","why":"可能、未必、不能排除 を使って、断定できない内容を慎重に伝えます。","pattern":"可能 / 未必 / 不能排除","tip":"根拠の範囲を超えた断定を避けます。","examples":["这种解释未必正确。=この説明は必ずしも正しいとは限りません。","目前不能排除其他原因。=現時点では別の原因を排除できません。","这一结果可能受到偏差影响。=この結果は偏りの影響を受けた可能性があります。","证据尚不足以得出结论。=証拠はまだ結論を出すには不十分です。"]},{"title":"文章の含意を読み取る","why":"複雑な文章を、根拠・仮定・結論に分解して読む練習をします。","pattern":"前提 → 证据 → 结论","tip":"「示唆される」ことと「証明される」ことは異なります。","examples":["这并不意味着所有情况都相同。=これはすべての状況が同じだという意味ではありません。","结论取决于前提是否成立。=結論は前提が成立するかどうかに依存します。","还存在其他合理解释。=ほかにも合理的な説明が存在します。","作者没有对这个问题作出明确判断。=筆者はこの問題に明確な判断を示していません。"]}]]};
for(const lang of Object.keys(COURSE))for(let li=0;li<COURSE[lang].length;li++){
 const unit=COURSE[lang][li];
 const extra=EXTRA_SECTIONS[lang][li];
 for(const sect of extra){
  const e=sect.examples.map(x=>x.split('='));
  const target=e[0][0],good=e[0][1];
  const wrong=e.slice(1).map(p=>p[1]);
  unit.sections.push(SC(sect.title,sect.why,sect.pattern,sect.examples,sect.tip,[`「${target}」の意味は？`,good,wrong[0],wrong[1],`「${target}」は「${good}」という意味です。` ]));
 }
}

// v6: 追加の学習教材（既存5セクションの後に5件ずつ追加）
// 以前のセクション番号 0〜4 と保存済み学習履歴を維持する。
const EXTRA_V6={"en":[[{"title":"別れ際の一言","why":"別れ際のあいさつは状況や次に会う時期によって変わります。","pattern":"See you ... / Have a ...","tip":"Goodbye は一般的な別れの言葉です。","examples":["See you tomorrow.=また明日会いましょう。","Have a nice day.=良い一日を。"]},{"title":"名前と出身を伝える","why":"出身地と名前を組み合わせると、自己紹介を一歩深められます。","pattern":"I am from ... / I live in ...","tip":"from は出身地、live in は現在住んでいる場所を表します。","examples":["I am from Japan.=私は日本出身です。","I live in Tokyo.=私は東京に住んでいます。"]},{"title":"複数の人を紹介する","why":"人を一人ではなく複数人として紹介する場合は、主語と be 動詞の組を変えます。","pattern":"We are ... / They are ...","tip":"we と they の後には通常 are を使います。","examples":["We are friends.=私たちは友達です。","They are students.=彼らは学生です。"]},{"title":"近くと遠くを区別する","why":"近くのものは this、遠くのものは that。複数なら these と those を使います。","pattern":"this / that / these / those","tip":"these と those は複数を表すので are と組み合わせます。","examples":["These are my keys.=これらは私の鍵です。","Those are your shoes.=あれらはあなたの靴です。"]},{"title":"聞き返して確認する","why":"知らないことを無理に答えず、聞き返したり確認したりする表現を身につけます。","pattern":"Sorry? / What does ... mean?","tip":"丁寧に聞き返すなら Could you repeat that? も使えます。","examples":["Could you repeat that?=もう一度言っていただけますか？","What does this mean?=これはどういう意味ですか？"]}],[{"title":"好き嫌いを広げる","why":"like だけでなく love、prefer、hate で好みの強さを表します。","pattern":"prefer A to B","tip":"prefer A to B は「B より A を好む」です。","examples":["I prefer tea to coffee.=私はコーヒーより紅茶が好きです。","She loves cooking.=彼女は料理が大好きです。"]},{"title":"短い答えの作り方","why":"Do / Does で聞かれた質問には、同じ助動詞で短く答えられます。","pattern":"Yes, I do. / No, she doesn't.","tip":"doesn't の後の動詞は原形にします。","examples":["Do you play tennis?=テニスをしますか？","No, I don't.=いいえ、しません。"]},{"title":"持ち物を説明する","why":"have と has の違いを理解すると所有や関係を説明できます。","pattern":"I have ... / He has ...","tip":"he/she/it の現在形は has を使います。","examples":["My sister has a bicycle.=妹は自転車を持っています。","I have two cats.=私は猫を二匹飼っています。"]},{"title":"前置詞で時を言う","why":"時刻・曜日・月で at、on、in を使い分けます。","pattern":"at 7 / on Monday / in July","tip":"特定の時刻に at、曜日に on、月や季節に in が基本です。","examples":["The shop opens at ten.=その店は10時に開きます。","My birthday is in May.=私の誕生日は5月です。"]},{"title":"数と量を伝える","why":"数えられる名詞の複数形と、数えられない名詞の量を区別します。","pattern":"two apples / some water","tip":"water のような不可算名詞には通常 -s を付けません。","examples":["We need three eggs.=卵が三つ必要です。","Can I have some water?=お水をいただけますか？"]}],[{"title":"過去の質問をする","why":"過去の行動について尋ねるときは Did + 動詞の原形を使います。","pattern":"Did you + 動詞原形 ...?","tip":"過去を示す did があるとき本動詞は原形に戻ります。","examples":["Did you watch the game?=その試合を見ましたか？","I didn't go yesterday.=私は昨日行きませんでした。"]},{"title":"進行中と習慣を比べる","why":"「今していること」と「普段すること」を現在進行形と現在形で分けます。","pattern":"I am doing ... / I do ...","tip":"now は進行形、every day は現在形がよく合います。","examples":["I am reading now.=私は今読書しています。","I read before bed.=私は寝る前に本を読みます。"]},{"title":"一日の流れを語る","why":"習慣の順番を first、then、after that でつなぎます。","pattern":"first / then / finally","tip":"短い接続語で文章の流れが分かりやすくなります。","examples":["First, I make breakfast.=まず朝食を作ります。","Then I take the bus.=それからバスに乗ります。"]},{"title":"誘いを受ける・断る","why":"約束を取り付ける際に、誘いへの自然な返事を学びます。","pattern":"Would you like to ...? / I'd love to.","tip":"断るときは理由を簡単に付けると丁寧です。","examples":["Would you like to join us?=私たちと一緒に参加しませんか？","I'd love to, but I'm busy.=ぜひ参加したいのですが、忙しいです。"]},{"title":"移動手段を説明する","why":"電車や徒歩などの移動手段を by と on foot で示します。","pattern":"by train / on foot","tip":"交通手段の by の後には通常冠詞を置きません。","examples":["I go to work by train.=私は電車で通勤します。","We went there on foot.=私たちはそこへ歩いて行きました。"]}],[{"title":"完了した直後を伝える","why":"現在完了形に just を加えると、直前に終わったことを表します。","pattern":"have just + 過去分詞","tip":"just は通常 have と過去分詞の間に置きます。","examples":["I have just finished lunch.=ちょうど昼食を終えたところです。","She has already left.=彼女はもう出発しました。"]},{"title":"長さと継続を表す","why":"since と for を使い分けて、いつからどのくらい続くかを伝えます。","pattern":"since 2020 / for three years","tip":"since は起点、for は期間を示します。","examples":["I have lived here for five years.=私はここに5年間住んでいます。","He has worked here since April.=彼は4月からここで働いています。"]},{"title":"程度を比べる","why":"much、a little を使うと比較級に差の程度を加えられます。","pattern":"much better / a little harder","tip":"very better とは言わず、much better などを使います。","examples":["This route is much shorter.=この道はずっと短いです。","Today is a little colder.=今日は少し寒いです。"]},{"title":"理由を加えて説明する","why":"関係節により名詞を限定すると、複数の候補から対象を特定できます。","pattern":"the book that I borrowed","tip":"目的語の関係代名詞は省略されることがあります。","examples":["The book I borrowed was interesting.=借りた本は面白かったです。","The man who lives next door is kind.=隣に住む男性は親切です。"]},{"title":"目的を言い表す","why":"to 不定詞を使い「〜するために」という目的を伝えます。","pattern":"to + 動詞原形","tip":"I went to ... to buy ... のように行動と目的を結びます。","examples":["I went out to buy milk.=牛乳を買うために外出しました。","She studies hard to pass the exam.=彼女は試験に合格するために熱心に勉強します。"]}],[{"title":"申し出と依頼の違い","why":"Would you like ...? は申し出、Could you ...? は相手への依頼です。","pattern":"Would you like ...? / Could you ...?","tip":"動詞の原形が続く依頼と名詞が続く申し出を区別します。","examples":["Would you like some tea?=紅茶はいかがですか？","Could you close the window?=窓を閉めていただけますか？"]},{"title":"可能性を表す may と might","why":"may と might で不確かな推測を示せます。","pattern":"may / might + 動詞原形","tip":"文脈により確実性の差は小さい場合もあります。","examples":["It might rain later.=あとで雨が降るかもしれません。","She may be at home.=彼女は家にいるかもしれません。"]},{"title":"禁止と不要を区別する","why":"must not は禁止、do not have to は必要がないことです。","pattern":"mustn't / don't have to","tip":"「しなくてよい」を mustn't にすると意味が変わります。","examples":["You mustn't park here.=ここに駐車してはいけません。","You don't have to hurry.=急ぐ必要はありません。"]},{"title":"助言をやわらかく伝える","why":"If I were you や You could を使い、命令せずに提案できます。","pattern":"If I were you, I'd ...","tip":"仮定の形が助言の強さを和らげます。","examples":["If I were you, I'd rest.=私なら休みます。","You could try another way.=別の方法を試してもよいでしょう。"]},{"title":"計画と意志を分ける","why":"be going to は意図や予測、will はその場の意志や予測によく使います。","pattern":"be going to / will","tip":"どちらも未来を表せますが、話す状況に注目します。","examples":["I'm going to study tonight.=今夜は勉強するつもりです。","I'll help you with that.=それなら私が手伝います。"]}],[{"title":"理由を複数示す","why":"because に加えて since、as を使うと説明の流れを変えられます。","pattern":"since / as + 文","tip":"since には「〜以来」の意味もあるため文脈が大切です。","examples":["Since it was late, we left.=遅かったので帰りました。","As the road was closed, we walked.=道路が閉鎖されていたので歩きました。"]},{"title":"例外条件を付ける","why":"unless は「〜でない限り」を一語で表します。","pattern":"unless + 文","tip":"unless は if ... not と近い意味です。","examples":["Unless it rains, we'll go.=雨が降らない限り行きます。","You can't enter unless you have a ticket.=チケットがなければ入れません。"]},{"title":"結果をはっきり示す","why":"so ... that 構文で程度と結果をつなぎます。","pattern":"so + 形容詞 + that ...","tip":"that 以下で何が起こったかを伝えます。","examples":["It was so cold that we stayed home.=とても寒かったので家にいました。","She was so tired that she fell asleep.=彼女はとても疲れて眠ってしまいました。"]},{"title":"対比を整理する","why":"on the other hand と whereas は対比する二つの事実を結びます。","pattern":"whereas / on the other hand","tip":"同じ側面を比較すると違いが伝わりやすくなります。","examples":["I prefer tea, whereas he prefers coffee.=私は紅茶が好きですが彼はコーヒーが好きです。","This plan is cheaper; on the other hand, it takes longer.=この案は安い一方で時間がかかります。"]},{"title":"意見の強さを調整する","why":"I believe と I suppose で確信の強さを調整します。","pattern":"I believe ... / I suppose ...","tip":"客観的事実と自分の推測を区別して話しましょう。","examples":["I believe the plan will work.=この計画はうまくいくと思います。","I suppose we could wait.=待ってもよいのではないかと思います。"]}],[{"title":"過去の時点より前","why":"by the time や before によって、過去の二つの出来事の順序を明確にします。","pattern":"had + 過去分詞 / by the time","tip":"過去完了は過去の基準点より前の出来事を表せます。","examples":["By the time I arrived, the movie had started.=私が着いた時には映画が始まっていました。","She had left before I called.=私が電話する前に彼女は出かけていました。"]},{"title":"受動態と行為者","why":"by を使うと受動態でも行為をした人を伝えられます。","pattern":"be + 過去分詞 + by ...","tip":"誰がしたかが不要なら by 以下は省けます。","examples":["The bridge was built by local workers.=その橋は地元の作業員によって建設されました。","The report was written yesterday.=その報告書は昨日書かれました。"]},{"title":"完了の受動態","why":"過去から今までの変化を受動態の現在完了で伝えます。","pattern":"have been + 過去分詞","tip":"has と have は主語に合わせます。","examples":["The files have been updated.=ファイルは更新されています。","A new rule has been introduced.=新しい規則が導入されました。"]},{"title":"時間の接続詞","why":"after、until、as soon as で出来事のタイミングをつなげます。","pattern":"as soon as + 文","tip":"未来のことでも時間の副詞節では現在形を使うことが多いです。","examples":["Call me as soon as you arrive.=着いたらすぐ電話してください。","We waited until the rain stopped.=雨がやむまで待ちました。"]},{"title":"間接話法の時制","why":"過去の発言を伝える際には、文脈により時制が一段過去に移ることがあります。","pattern":"said (that) ...","tip":"現在でも変わらない事実なら時制を維持することもあります。","examples":["He said that he was busy.=彼は忙しいと言いました。","She told me she had finished.=彼女は終わらせたと私に伝えました。"]}],[{"title":"非現実の願い","why":"I wish を使い、現実と違う状況への願いを表します。","pattern":"I wish + 過去形","tip":"現在の願いでも過去形で距離を表します。","examples":["I wish I knew the answer.=答えを知っていればなあ。","I wish I had more time.=もっと時間があればなあ。"]},{"title":"可能だったはずを話す","why":"could have は過去に可能だったこと、might have は過去の不確かな推測を表します。","pattern":"could have / might have + 過去分詞","tip":"過去の事実だと決めつける表現ではありません。","examples":["We could have taken a taxi.=私たちはタクシーに乗ることもできたはずです。","He might have forgotten.=彼は忘れたのかもしれません。"]},{"title":"混合仮定法","why":"過去の出来事が現在に及ぼす仮の影響を表します。","pattern":"If + 過去完了, would + 動詞原形","tip":"条件は過去、結果は現在という時間のずれがあります。","examples":["If I had slept well, I would feel better now.=よく眠っていたら今もっと体調がいいでしょう。","If she had studied abroad, she might speak French now.=留学していたら今フランス語を話せたかもしれません。"]},{"title":"条件と譲歩を合わせる","why":"even if は「たとえ〜でも」で、条件に左右されないことを表します。","pattern":"even if + 文","tip":"even though は既知の事実との対比に使われることが多いです。","examples":["Even if it rains, I'll go.=たとえ雨でも行きます。","Even though it rained, we went.=雨が降ったのに私たちは行きました。"]},{"title":"推論の確実度","why":"must have と can't have で過去について強い推論を表します。","pattern":"must have / can't have + 過去分詞","tip":"must have は過去の義務ではなく推論の意味になることがあります。","examples":["She must have been tired.=彼女は疲れていたに違いありません。","He can't have seen it.=彼がそれを見たはずがありません。"]}],[{"title":"結論への道筋","why":"therefore と consequently は根拠から結論を示す接続語です。","pattern":"therefore / consequently","tip":"接続副詞の前後の文のつながりを確認しましょう。","examples":["The data were incomplete; therefore, we delayed the decision.=データが不完全だったため決定を延期しました。","Costs increased; consequently, profits fell.=費用が増加し、その結果利益が減りました。"]},{"title":"範囲を限定する","why":"in some cases や to some extent により、主張を必要以上に広げない表現を学びます。","pattern":"in some cases / to some extent","tip":"all や always の強い断定との違いが大切です。","examples":["This is true in some cases.=これは一部の場合に当てはまります。","I agree to some extent.=ある程度は賛成です。"]},{"title":"相関と因果","why":"correlation と causation は異なります。文章で因果を断定していないか検討します。","pattern":"be associated with / cause","tip":"associated with だけでは因果は証明されません。","examples":["Sleep is associated with memory performance.=睡眠は記憶の成績と関連しています。","This does not prove that stress caused the change.=これはストレスが変化を引き起こした証明にはなりません。"]},{"title":"反例を扱う","why":"however や nevertheless を使って、予想に反する例を公正に示します。","pattern":"however / nevertheless","tip":"反例を無視せず、主張の条件を見直しましょう。","examples":["The method is fast; however, it is less accurate.=その方法は速いですが精度は低めです。","The sample was small; nevertheless, the pattern was consistent.=標本は小さかったものの傾向は一貫していました。"]},{"title":"読み手を意識した説明","why":"in contrast や for example を使い、主張の構造を読み手に示します。","pattern":"for example / in contrast","tip":"実例と比較を組み合わせると説明が具体化します。","examples":["For example, smaller groups responded differently.=例えば小さな集団は異なる反応を示しました。","In contrast, the control group showed no change.=対照群には対照的に変化が見られませんでした。"]}],[{"title":"省略の復元","why":"複雑な文章では繰り返しを避けるために文の一部が省略されます。","pattern":"although + 形容詞 / when + 過去分詞","tip":"省略した主語を補うと構造が分かりやすくなります。","examples":["Although difficult, the task is possible.=難しいものの、その課題は可能です。","When asked, she declined to comment.=尋ねられたとき彼女はコメントを控えました。"]},{"title":"強調構文を読み取る","why":"It is ... that 構文は文中の特定の要素を強調します。","pattern":"It is ... that ...","tip":"強調されていない基本文に戻して意味を確認します。","examples":["It was the timing that caused the problem.=問題を引き起こしたのはタイミングでした。","It is this distinction that matters.=重要なのはこの区別です。"]},{"title":"婉曲的な否定","why":"not necessarily や far from で強い肯定を避けたり見直したりできます。","pattern":"not necessarily / far from","tip":"not necessarily は「必ずしも〜ない」であり完全な否定ではありません。","examples":["This is not necessarily a mistake.=これは必ずしも間違いではありません。","The issue is far from resolved.=問題は解決にはほど遠い状態です。"]},{"title":"根拠の限界を述べる","why":"データの制約を示し、主張の確実性を慎重に評価します。","pattern":"the evidence suggests / cannot rule out","tip":"suggests は proves より弱い主張です。","examples":["The evidence suggests a possible link.=証拠は関連の可能性を示唆します。","We cannot rule out other explanations.=別の説明の可能性も否定できません。"]},{"title":"条件付きの結論","why":"前提を明示した上で結論を述べると誤解を減らせます。","pattern":"provided that / assuming that","tip":"仮定が満たされない場合、結論も変わり得ます。","examples":["The plan works provided that costs remain stable.=費用が安定していれば計画は機能します。","Assuming the estimate is correct, we have enough time.=推定が正しければ時間は十分あります。"]}]],"ko":[[{"title":"別れのあいさつ","why":"韓国語では相手が去るのか自分が去るのかによって別れの言葉が変わります。","pattern":"안녕히 가세요 / 안녕히 계세요","tip":"가세요 は去る相手に、계세요 は残る相手に使います。","examples":["안녕히 가세요.=さようなら（去る人へ）。","안녕히 계세요.=さようなら（残る人へ）。"]},{"title":"自己紹介の一歩先","why":"名前に加え出身地も伝える練習をします。","pattern":"저는 ... 출신이에요","tip":"저 は丁寧な「私」、출신 は出身です。","examples":["저는 일본 출신이에요.=私は日本出身です。","저는 도쿄에서 왔어요.=私は東京から来ました。"]},{"title":"パッチムに慣れる","why":"ハングルの音節の下に付く子音をパッチムと呼びます。読み方を例で覚えましょう。","pattern":"밥 / 책 / 집","tip":"パッチムでは子音の発音が単純化されることがあります。","examples":["밥을 먹어요.=ご飯を食べます。","책이 있어요.=本があります。"]},{"title":"母音の組み合わせ","why":"ㅏ と ㅓ、ㅗ と ㅜ の音を区別して単語に結びつけます。","pattern":"아 / 어 / 오 / 우","tip":"日本語の母音と完全に同じとは限りません。","examples":["어디예요?=どこですか？","우유를 마셔요.=牛乳を飲みます。"]},{"title":"初対面で尋ねる","why":"名前や国を聞く質問を身につけます。","pattern":"이름이 뭐예요?","tip":"뭐예요 は「何ですか」を表します。","examples":["이름이 뭐예요?=お名前は何ですか？","어느 나라 사람이에요?=どこの国の人ですか？"]}],[{"title":"目的語の助詞","why":"을/를 は動作の対象を示します。語末のパッチムで形が変わります。","pattern":"명사 + 을/를","tip":"パッチムありは 을、なしは 를 が基本です。","examples":["물을 마셔요.=水を飲みます。","책을 읽어요.=本を読みます。"]},{"title":"動詞の語幹","why":"辞書形の 다 を取った語幹に語尾を付けて活用します。","pattern":"먹다 → 먹어요","tip":"母音によって 아요 と 어요 が使い分けられます。","examples":["공부해요.=勉強します。","친구를 만나요.=友達に会います。"]},{"title":"主題を切り替える","why":"은/는 は話の話題を示します。이/가 と比べて使い方を見てみます。","pattern":"저는 / 제가","tip":"対比や話題提示には 은/는 がよく使われます。","examples":["저는 커피를 마셔요.=私はコーヒーを飲みます。","제가 할게요.=私がやります。"]},{"title":"どこにあるか尋ねる","why":"場所を表す 에 と存在を表す 있어요/없어요 を組み合わせます。","pattern":"...에 있어요?","tip":"場所を尋ねるときは 어디에 を使います。","examples":["화장실이 어디에 있어요?=トイレはどこにありますか？","책상 위에 있어요.=机の上にあります。"]},{"title":"できないことを伝える","why":"안 は一般的な否定、못 は能力や事情でできないことを示します。","pattern":"안 / 못 + 動詞","tip":"안 と 못 では理由やニュアンスが異なります。","examples":["오늘은 못 가요.=今日は行けません。","저는 고기를 안 먹어요.=私は肉を食べません。"]}],[{"title":"昨日の行動を詳しく","why":"過去形 -았어요/-었어요 を使って過去の動作を説明します。","pattern":"어제 + 過去形","tip":"하다 は 했어요 に変わります。","examples":["어제 영화를 봤어요.=昨日映画を見ました。","집에서 쉬었어요.=家で休みました。"]},{"title":"今していること","why":" -고 있어요 は進行中の動作を表します。","pattern":"동사 + 고 있어요","tip":"習慣は普通 -아요/-어요 で話すことが多いです。","examples":["지금 숙제를 하고 있어요.=今宿題をしています。","버스를 기다리고 있어요.=バスを待っています。"]},{"title":"明日の予定を話す","why":" -려고 해요 は「〜しようと思います」という意図を表します。","pattern":"동사 + (으)려고 해요","tip":"予定の意図を述べるときに便利です。","examples":["내일 일찍 일어나려고 해요.=明日は早起きしようと思います。","주말에 여행하려고 해요.=週末に旅行しようと思います。"]},{"title":"数字を数え分ける","why":"韓国語には固有数詞と漢数詞があり、数えるものによって使い分けます。","pattern":"한 개 / 두 명 / 삼 분","tip":"時刻の「時」は固有数詞、「分」は漢数詞が基本です。","examples":["사과 두 개 주세요.=リンゴを二個ください。","지금 세 시예요.=今3時です。"]},{"title":"日付と時刻を指定する","why":"월、일、요일 を使い、日にちと曜日を区別します。","pattern":"월 / 일 / 요일","tip":"날짜 は日付、시간 は時間です。","examples":["회의는 월요일이에요.=会議は月曜日です。","수업은 아홉 시에 시작해요.=授業は9時に始まります。"]}],[{"title":"希望の理由を加える","why":" -고 싶어요 に理由を続けると希望が具体的になります。","pattern":"...고 싶어서 ...","tip":"싶다 は希望、-아서/-어서 は理由にも使われます。","examples":["한국어를 배우고 싶어요.=韓国語を学びたいです。","쉬고 싶어서 집에 왔어요.=休みたくて家に帰りました。"]},{"title":"お願いを柔らかく","why":" -아/어 주세요 と -아/어 주시겠어요? でお願いの丁寧さを調整します。","pattern":"...해 주세요 / ...주시겠어요?","tip":"주세요 は日常的、주시겠어요 はより丁寧な依頼です。","examples":["천천히 말해 주세요.=ゆっくり話してください。","문을 닫아 주시겠어요?=ドアを閉めていただけますか？"]},{"title":"丁寧な主語と動詞","why":"年長者や目上の人について話すとき尊敬形を使います。","pattern":"계세요 / 드세요","tip":"있어요 の尊敬形が 계세요 です。","examples":["선생님이 교실에 계세요.=先生は教室にいらっしゃいます。","할머니가 식사하세요.=祖母が食事をなさいます。"]},{"title":"理由の言い換え","why":" -기 때문에 は理由を説明する表現です。","pattern":"...기 때문에 ...","tip":"だからという結論はその後で述べます。","examples":["비가 오기 때문에 집에 있어요.=雨が降るので家にいます。","시간이 없기 때문에 택시를 탔어요.=時間がないのでタクシーに乗りました。"]},{"title":"しかしを自然につなぐ","why":"그런데 と 그렇지만 のニュアンスを確認し、文をつなぎます。","pattern":"그런데 / 그렇지만","tip":"그런데 は話題を切り替えるときにも使います。","examples":["날씨는 좋아요. 그런데 바람이 세요.=天気はいいです。でも風が強いです。","비싸지만 품질이 좋아요.=高いですが品質が良いです。"]}],[{"title":"条件のある約束","why":" -(으)면 を使って、実現する条件と結果を述べます。","pattern":"시간이 있으면 ...","tip":"語幹のパッチムで 으면/면 が変わります。","examples":["시간이 있으면 전화해 주세요.=時間があれば電話してください。","비가 오면 안 갈 거예요.=雨が降ったら行きません。"]},{"title":"可能性の話し方","why":" -(으)ㄹ 수 있어요 で能力や可能性を表します。","pattern":"할 수 있어요","tip":"できない場合は 할 수 없어요 です。","examples":["저는 운전할 수 있어요.=私は運転できます。","이 문제를 풀 수 없어요.=この問題を解けません。"]},{"title":"許可を尋ねる","why":" -아/어도 돼요? で「〜してもよいですか」を尋ねます。","pattern":"...아/어도 돼요?","tip":"許可と能力の意味を混同しないようにします。","examples":["여기 앉아도 돼요?=ここに座ってもいいですか？","사진을 찍어도 돼요?=写真を撮ってもいいですか？"]},{"title":"義務を丁寧に伝える","why":" -아/어야 해요 は「〜しなければならない」です。","pattern":"...아/어야 해요","tip":"禁止とは違い、行う必要を表します。","examples":["약을 먹어야 해요.=薬を飲まなければなりません。","오늘 보고서를 내야 해요.=今日報告書を出さなければなりません。"]},{"title":"経験したことを尋ねる","why":" -아/어 본 적 있어요? で経験の有無を尋ねます。","pattern":"...본 적 있어요?","tip":"過去に一度でも経験したかが焦点です。","examples":["제주도에 가 본 적 있어요?=済州島に行ったことがありますか？","이 음식을 먹어 본 적 없어요.=この料理を食べたことがありません。"]}],[{"title":"尊敬表現の聞き方","why":"尊敬語でも相手の予定や行動を尋ねられます。","pattern":"언제 오세요? / 무엇을 하세요?","tip":"場面に応じて 높임말 の丁寧さを選びます。","examples":["사장님은 언제 오세요?=社長はいついらっしゃいますか？","어머님은 무엇을 하세요?=お母様は何をなさいますか？"]},{"title":"伝聞の短縮形","why":" -대요 は人から聞いた話を日常的に伝える形です。","pattern":"...대요 / ...래요","tip":"原形 -다고 해요 と話し言葉の -대요 を比較します。","examples":["내일 비가 온대요.=明日は雨が降るそうです。","친구가 학생이래요.=友達は学生だそうです。"]},{"title":"もし時間があれば","why":"条件節と提案を組み合わせ、具体的な行動につなげます。","pattern":"...으면 같이 ...","tip":"一つの文で条件と依頼を表せます。","examples":["시간이 나면 같이 점심 먹어요.=時間ができたら一緒に昼食を食べましょう。","괜찮으면 내일 만나요.=よければ明日会いましょう。"]},{"title":"推測をやわらかくする","why":" -것 같아요 は断定を避けた推測・感想を示します。","pattern":"...것 같아요","tip":"動詞・形容詞で前の形が変わります。","examples":["오늘은 추울 것 같아요.=今日は寒そうです。","그 사람이 맞는 것 같아요.=その人で合っているようです。"]},{"title":"動作の順番を示す","why":" -고 나서 は一つの動作を終えたあとに次の動作をします。","pattern":"...고 나서 ...","tip":"順序に意味がある行動に使います。","examples":["밥을 먹고 나서 공부해요.=ご飯を食べてから勉強します。","숙제를 끝내고 나서 쉬었어요.=宿題を終えてから休みました。"]}],[{"title":"失敗と経験を区別する","why":" -아/어 버리다 は行為が完了したことや話し手の感情を表せます。","pattern":"...아/어 버렸어요","tip":"残念さやすっきりした気持ちは文脈で決まります。","examples":["휴대폰을 잃어버렸어요.=携帯電話をなくしてしまいました。","숙제를 다 해 버렸어요.=宿題を全部終えてしまいました。"]},{"title":"自然に変わる状況","why":" -아/어지다 で状態の変化を表します。","pattern":"...아/어지다","tip":"形容詞の語幹に付くと「〜くなる」です。","examples":["날씨가 따뜻해졌어요.=天気が暖かくなりました。","한국어가 쉬워졌어요.=韓国語が簡単になりました。"]},{"title":"他人の話を間接的に","why":" -냐고 하다 は疑問文を間接的に引用するときに使います。","pattern":"...냐고 물었어요","tip":"直接引用と間接引用では文の形が変わります。","examples":["친구가 어디 가냐고 물었어요.=友達がどこへ行くのか尋ねました。","선생님이 숙제를 했냐고 물으셨어요.=先生が宿題をしたか尋ねられました。"]},{"title":"受け身と自然な出来事","why":" -이/히/리/기 が動詞に付く受動表現を観察します。","pattern":"문이 열리다 / 길이 보이다","tip":"すべての動詞が同じ形になるわけではありません。","examples":["문이 열렸어요.=ドアが開きました。","산이 멀리 보여요.=山が遠くに見えます。"]},{"title":"行動を名詞にする","why":" -는 것 で行動そのものを名詞として扱えます。","pattern":"동사 + 는 것","tip":"好きなこと・難しいことを説明できます。","examples":["책을 읽는 것을 좋아해요.=本を読むのが好きです。","일찍 일어나는 게 어려워요.=早起きするのが難しいです。"]}],[{"title":"もし〜だったら","why":" -았/었으면 좋겠어요 は実際と違う願望を表します。","pattern":"...았/었으면 좋겠어요","tip":"過去形の形でも願いの対象が現在・未来の場合があります。","examples":["시간이 더 많았으면 좋겠어요.=もっと時間があればいいのに。","내일 날씨가 좋았으면 좋겠어요.=明日は天気が良いといいな。"]},{"title":"過去の別の選択","why":" -(으)ㄹ 걸 그랬어요 は「〜すればよかった」と後悔する表現です。","pattern":"...ㄹ 걸 그랬어요","tip":"実際にしなかった行動への後悔です。","examples":["우산을 가져올 걸 그랬어요.=傘を持ってくればよかったです。","좀 더 일찍 갈 걸 그랬어요.=もう少し早く行けばよかったです。"]},{"title":"予想が外れたとき","why":" -(으)ㄹ 줄 알았어요 は予想・認識の違いを表せます。","pattern":"...ㄹ 줄 알았어요","tip":"後ろに 하지만 を置けば現実との差を伝えられます。","examples":["시험이 쉬울 줄 알았어요.=試験は簡単だと思っていました。","벌써 끝났을 줄 알았어요.=もう終わったと思っていました。"]},{"title":"困難でも続ける","why":" -는데도 は「〜なのに」と予想外の結果を表します。","pattern":"...는데도 ...","tip":"逆接と譲歩の関係を確認します。","examples":["비가 오는데도 뛰었어요.=雨が降っているのに走りました。","바쁜데도 도와줬어요.=忙しいのに手伝ってくれました。"]},{"title":"譲歩と強い決意","why":" -더라도 は「たとえ〜しても」です。","pattern":"...더라도 ...","tip":"仮定の条件にかかわらず結果が続きます。","examples":["늦더라도 꼭 갈게요.=遅れても必ず行きます。","어렵더라도 포기하지 마세요.=難しくても諦めないでください。"]}],[{"title":"論点を一つに絞る","why":" -다는 점에서 は特定の観点や理由を述べます。","pattern":"...다는 점에서","tip":"一般論とこの観点での評価を分けます。","examples":["비용이 적다는 점에서 유리해요.=費用が少ないという点で有利です。","시간이 걸린다는 점이 문제예요.=時間がかかるという点が問題です。"]},{"title":"見込みと証拠","why":" -(으)ㄹ 가능성이 있다 で「可能性がある」と示します。","pattern":"...가능성이 있어요","tip":"事実確定と可能性の区別が大切です。","examples":["가격이 오를 가능성이 있어요.=価格が上がる可能性があります。","오류가 발생할 가능성이 낮아요.=エラーが発生する可能性は低いです。"]},{"title":"情報の出典を示す","why":" -에 따르면 は何を根拠としているか示す表現です。","pattern":"...에 따르면 ...","tip":"自分の意見と資料の記述を区別します。","examples":["보고서에 따르면 비용이 줄었어요.=報告書によれば費用は減りました。","조사 결과에 따르면 차이가 작아요.=調査結果によれば差は小さいです。"]},{"title":"反論を整理して述べる","why":" -기는 하지만 は一部を認めてから別の判断を述べます。","pattern":"...기는 하지만 ...","tip":"相手の指摘を全部否定しない言い方です。","examples":["좋기는 하지만 너무 비싸요.=良いことは良いですが高すぎます。","필요하기는 하지만 서두를 이유는 없어요.=必要ではありますが急ぐ理由はありません。"]},{"title":"文章をまとめる","why":"따라서 と 반면에 は結論と対比をつなぎます。","pattern":"따라서 / 반면에","tip":"前後の関係を見て適切に選びます。","examples":["자료가 부족합니다. 따라서 결론을 내리기 어렵습니다.=資料が不足しています。したがって結論を出すのは難しいです。","비용은 줄었지만 반면에 시간이 더 들었습니다.=費用は減りましたが、一方で時間は余計にかかりました。"]}],[{"title":"必ずとは限らない","why":"반드시 ... 것은 아니다 で断定を弱めます。","pattern":"반드시 ... 것은 아니다","tip":"一部の反例があることと完全な否定は異なります。","examples":["빠르다고 반드시 좋은 것은 아니에요.=速いからといって必ず良いわけではありません。","모든 변화가 나쁜 것은 아니에요.=すべての変化が悪いわけではありません。"]},{"title":"条件付きの判断","why":" -는 한 は「〜する限り」という条件や範囲を示します。","pattern":"...는 한 ...","tip":"条件が変われば判断も変わり得ます。","examples":["문제가 없는 한 계속하겠습니다.=問題がない限り続けます。","이 조건이 유지되는 한 결과는 같아요.=この条件が維持される限り結果は同じです。"]},{"title":"研究から読み取れること","why":"시사하다 は示唆する意味で、証明と区別します。","pattern":"...시사합니다","tip":"断定し過ぎない学術的表現に注意します。","examples":["이 결과는 연관성을 시사합니다.=この結果は関連性を示唆しています。","증거만으로는 원인을 확정할 수 없습니다.=証拠だけでは原因を確定できません。"]},{"title":"言い換えて明確にする","why":"다시 말해 は内容を言い換えて整理します。","pattern":"다시 말해 / 즉","tip":"同じ意味をより短く伝えるときに使います。","examples":["다시 말해, 시간이 더 필요합니다.=言い換えると、さらに時間が必要です。","즉, 두 결과는 같지 않습니다.=つまり二つの結果は同じではありません。"]},{"title":"異なる解釈を示す","why":"한편 と 다만 で別の視点と留保を提示します。","pattern":"한편 / 다만","tip":"単純な賛否で終わらず条件や例外を示します。","examples":["한편 다른 해석도 가능합니다.=一方、別の解釈も可能です。","다만 표본이 작다는 한계가 있습니다.=ただし標本が小さいという限界があります。"]}]],"zh":[[{"title":"別れとお礼","why":"別れ際と感謝の基本表現を学び、短い会話をつなぎます。","pattern":"再见 / 谢谢 / 不客气","tip":"不客气 は感謝されたときの返事です。","examples":["明天见！=また明日！","不用谢。=どういたしまして。"]},{"title":"名前と国を伝える","why":"自己紹介に名前と出身地を加えて伝えます。","pattern":"我叫 ... / 我来自 ...","tip":"叫 は名前を名乗るとき、来自 は出身を表すときに使います。","examples":["我叫小林。=私は小林といいます。","我来自日本。=私は日本出身です。"]},{"title":"四声の違いを聞く","why":"声調の違いは語の意味に関わります。代表的な音を整理します。","pattern":"mā / má / mǎ / mà","tip":"同じ ma でも声調が変われば意味が変わります。","examples":["妈妈在家。=母は家にいます。","我想买书。=私は本を買いたいです。"]},{"title":"人を呼びかける","why":"我、你、他、她 と、複数形の 们 を使い分けます。","pattern":"我们 / 你们 / 他们","tip":"人称代名詞の複数形には 们 が付きます。","examples":["你们好吗？=皆さんお元気ですか？","我们是朋友。=私たちは友達です。"]},{"title":"簡単に聞き返す","why":"分からない内容を聞き返す表現を身につけます。","pattern":"请再说一遍 / 什么意思?","tip":"请 を付けると丁寧な依頼になります。","examples":["请再说一遍。=もう一度言ってください。","这个词是什么意思？=この単語はどういう意味ですか？"]}],[{"title":"何をするか伝える","why":"中国語の基本語順は主語・動詞・目的語です。場所・時の語句にも注目します。","pattern":"我 + 动词 + 宾语","tip":"動詞は原則として主語によって活用しません。","examples":["我每天喝茶。=私は毎日お茶を飲みます。","她喜欢音乐。=彼女は音楽が好きです。"]},{"title":"選択式の疑問文","why":"还是 を使えば二つの選択肢から尋ねることができます。","pattern":"A 还是 B?","tip":"肯定の「または」は 或者 を使います。","examples":["你喝茶还是咖啡？=お茶とコーヒーのどちらを飲みますか？","你坐车还是走路？=車に乗りますか、それとも歩きますか？"]},{"title":"場所を示す","why":"在 の後に場所を置き、いる場所や行為の場所を表します。","pattern":"在 + 場所","tip":"有 は存在、在 は位置に焦点を当てます。","examples":["我在图书馆。=私は図書館にいます。","他在家学习。=彼は家で勉強しています。"]},{"title":"家族を紹介する","why":"所有を表す 的 を使い、家族や持ち物を説明します。","pattern":"我的 / 你的 / 他的","tip":"親族のような近しい関係では 的 を省くことも多いです。","examples":["这是我的姐姐。=こちらは私の姉です。","他的书在桌子上。=彼の本は机の上にあります。"]},{"title":"数と量詞を組み合わせる","why":"中国語では数詞と名詞の間に量詞を置きます。","pattern":"数字 + 量词 + 名词","tip":"本には 本、人には 个 や 位 などを使います。","examples":["我有三本书。=私は本を三冊持っています。","这里有两个人。=ここに二人います。"]}],[{"title":"完了と状態の変化","why":"了 は出来事の完了だけでなく状態の変化も示すことがあります。","pattern":"动词 + 了 / ...了","tip":"了 が必ず過去形を意味するわけではありません。","examples":["我买了一张票。=私はチケットを一枚買いました。","天黑了。=暗くなりました。"]},{"title":"いま行っている動作","why":"正在 は進行中の行動を明示します。","pattern":"正在 + 动词","tip":"着 は状態の持続を表すことがあります。","examples":["他们正在开会。=彼らは会議中です。","我正在做饭。=私は料理を作っています。"]},{"title":"もう終わったかを聞く","why":"動作の完了について 了吗 と 还没 で質問・回答します。","pattern":"...了吗? / 还没...","tip":"否定の完了は 没（有）を使うのが一般的です。","examples":["你吃饭了吗？=もう食事をしましたか？","我还没吃。=私はまだ食べていません。"]},{"title":"まだしない・しなかった","why":"不 は習慣や意志の否定、没 は起きなかった出来事にも使います。","pattern":"不 + 动词 / 没 + 动词","tip":"否定の対象が習慣か過去の出来事かに注目します。","examples":["我不喝咖啡。=私はコーヒーを飲みません。","昨天我没去学校。=昨日私は学校に行きませんでした。"]},{"title":"時間の位置を覚える","why":"時間を表す語句は主語の後、動詞の前に置くのが基本です。","pattern":"我明天去...","tip":"時間語は文頭に置くこともできます。","examples":["我明天去北京。=私は明日北京へ行きます。","他晚上八点回来。=彼は夜8時に戻ります。"]}],[{"title":"より大きい・小さい","why":"比 の後に比較対象を置いて差を表します。","pattern":"A 比 B + 形容词","tip":"比較の形容詞に通常 很 は付けません。","examples":["这条路比那条路短。=この道はあの道より短いです。","今天比昨天热。=今日は昨日より暑いです。"]},{"title":"したことがある","why":"过 は経験を表します。回数を表す語と組み合わせられます。","pattern":"动词 + 过","tip":"以前経験があっても現在は違う場合があります。","examples":["我去过上海两次。=私は上海に二回行ったことがあります。","她没吃过这个菜。=彼女はこの料理を食べたことがありません。"]},{"title":"差の程度を示す","why":"比 と 多了、一点儿 などを組み合わせて差の大きさを伝えます。","pattern":"比 ... 多了 / 一点儿","tip":"差の程度は形容詞の後に置きます。","examples":["今天比昨天冷一点儿。=今日は昨日より少し寒いです。","这本书比那本贵多了。=この本はあの本よりずっと高いです。"]},{"title":"移動方向を具体的に","why":"来 と 去 で話し手から見た移動方向を表します。","pattern":"进来 / 出去","tip":"来 は話し手に近づく方向、去 は遠ざかる方向です。","examples":["请进来。=入ってきてください。","他走出去了。=彼は外へ出ていきました。"]},{"title":"できることの違い","why":"会 は習得した技能、能 は条件・能力、可以 は許可を表せます。","pattern":"会 / 能 / 可以","tip":"日本語の「できる」だけで同じと考えないようにします。","examples":["我会说一点儿中文。=私は中国語を少し話せます。","这里可以拍照吗？=ここで写真を撮ってもいいですか？"]}],[{"title":"仮定の条件を追加する","why":"要是 は If に近い口語的な仮定の条件です。","pattern":"要是 ... 就 ...","tip":"もし〜なら、という条件を結果の前に置きます。","examples":["要是下雨，我们就不去。=雨が降ったら私たちは行きません。","要是有时间，我就帮你。=時間があれば手伝います。"]},{"title":"理由を丁寧に述べる","why":"由于 は文章で理由を示すときによく使われます。","pattern":"由于 ... 因此 ...","tip":"原因と結果の関係を整理して読みます。","examples":["由于天气不好，比赛取消了。=天候が悪いため試合は中止になりました。","由于时间有限，我们提前出发。=時間が限られているので早めに出発します。"]},{"title":"依頼に応じる","why":"麻烦你 を使うと相手に何かをお願いする表現になります。","pattern":"麻烦你 ...","tip":"命令より柔らかな依頼になります。","examples":["麻烦你开一下门。=すみませんがドアを開けてください。","请帮我看一下。=少し見てもらえますか？"]},{"title":"義務の強さを示す","why":"应该 は助言、必须 は強い義務を表します。","pattern":"应该 / 必须","tip":"禁止には 不许 や 不能 を使うことがあります。","examples":["你应该休息。=あなたは休んだほうがいいです。","进入这里必须登记。=ここに入るには登録が必要です。"]},{"title":"選択を提案する","why":"不如 や 最好 で助言や提案を表します。","pattern":"不如 ... / 最好 ...","tip":"状況を見て押しつけにならない形を選びます。","examples":["我们不如坐地铁吧。=地下鉄に乗るほうがよさそうです。","你最好早点出门。=早めに出発したほうがいいですよ。"]}],[{"title":"目的語を前に出す","why":"把 は行為の対象を動詞の前に置き、処理の結果を説明します。","pattern":"把 + 目的语 + 动词 + 结果","tip":"具体的な対象をどうしたかが中心です。","examples":["请把门关上。=ドアを閉めてください。","我把手机放在桌子上了。=携帯電話を机の上に置きました。"]},{"title":"終わった結果を示す","why":"動詞の後に 完、好 などを置いて結果を伝えます。","pattern":"做完 / 准备好","tip":"動作と結果をセットで理解しましょう。","examples":["我做完作业了。=宿題を終えました。","饭已经做好了。=ご飯はもうできています。"]},{"title":"結果として起きたこと","why":"因此 と 结果 は結果を導く言葉ですが、文章や口語で使い方が異なります。","pattern":"因此 / 结果","tip":"接続語がつなぐ因果関係に注目します。","examples":["路上堵车，因此我们迟到了。=渋滞したため私たちは遅刻しました。","他没带钥匙，结果进不了门。=彼は鍵を持っておらず、結局中に入れませんでした。"]},{"title":"条件が整ったとき","why":"只要 ... 就 ... は条件が満たされれば可能になることを表します。","pattern":"只要 ... 就 ...","tip":"「〜さえすれば」という十分条件の意味です。","examples":["只要努力，就有机会。=努力さえすればチャンスがあります。","只要你同意，我们就开始。=あなたが賛成すれば始めます。"]},{"title":"対立しながら認める","why":"尽管 は現実の事柄を認めながら、逆の結果を述べられます。","pattern":"尽管 ... 但是 ...","tip":"逆接と譲歩の関係を整理しましょう。","examples":["尽管很累，他还是来了。=とても疲れていたのに彼は来ました。","尽管下雨，我们仍然出发。=雨にもかかわらず出発しました。"]}],[{"title":"確かさの異なる推量","why":"大概 と 恐怕 などで推測の確信や懸念を表します。","pattern":"大概 / 恐怕","tip":"恐怕 には望ましくない予測のニュアンスがあります。","examples":["他大概已经到了。=彼はおそらくもう到着しています。","恐怕今天来不及了。=残念ながら今日は間に合わなさそうです。"]},{"title":"人の発言を間接に述べる","why":"据说 は「〜だそうだ」、听说 は聞いた話を表します。","pattern":"据说 / 听说","tip":"伝聞は自分が確認した事実とは違います。","examples":["听说你要搬家。=引っ越すそうですね。","据说明天会下雪。=明日は雪が降るそうです。"]},{"title":"対象を指定して片づける","why":"把 と場所補語の組み合わせで「何をどこへ」を表します。","pattern":"把 ... 放在 ...","tip":"処理される対象は把 の後に置きます。","examples":["请把书放回书架。=本を本棚に戻してください。","他把照片贴在墙上。=彼は写真を壁に貼りました。"]},{"title":"受け身の被構文","why":"被 は誰かによる行為を受けたことを表します。","pattern":"被 + 行為者 + 動詞","tip":"行為者を省略することもできます。","examples":["我的包被人拿走了。=私のかばんは誰かに持ち去られました。","窗户被风吹开了。=窓が風で開きました。"]},{"title":"気づいた結果を話す","why":"看见、听懂 などは動作の達成を表す結果補語です。","pattern":"看见 / 听懂","tip":"単に見る・聞くことと理解・認知の結果を区別します。","examples":["我听懂了老师的话。=先生の言葉が聞いて理解できました。","你看见那个人了吗？=あの人を見かけましたか？"]}],[{"title":"前提が分かったら","why":"既然 ... 就 ... は既に認めた前提から結論を導きます。","pattern":"既然 ... 就 ...","tip":"もしの話ではなく、前提を受けた判断です。","examples":["既然你同意，我们就开始。=あなたが賛成しているのだから始めましょう。","既然已经来了，就进去看看吧。=せっかく来たのだから入って見てみましょう。"]},{"title":"よりよい選択を示す","why":"宁可 ... 也不 ... で選好を強く表します。","pattern":"宁可 ... 也不 ...","tip":"どちらを避けたいかが文の焦点です。","examples":["我宁可走路，也不坐出租车。=私はタクシーに乗るくらいなら歩きます。","他宁可等，也不改变计划。=彼は計画を変えるより待つほうを選びます。"]},{"title":"不利な条件を踏まえる","why":"即便 は「たとえ〜でも」という仮定の譲歩を示します。","pattern":"即便 ... 也 ...","tip":"否定的な条件でも結果は変わらないと述べます。","examples":["即便失败，我也想再试一次。=たとえ失敗してももう一度試したいです。","即便时间很短，也要认真准备。=時間が短くても真剣に準備しなければなりません。"]},{"title":"予想と違っても続ける","why":"哪怕 ... 也 ... は極端な条件でも判断を変えない表現です。","pattern":"哪怕 ... 也 ...","tip":"仮の譲歩を強調します。","examples":["哪怕只有一天，我也要参加。=たとえ一日だけでも参加したいです。","哪怕下大雨，他也会去。=大雨でも彼は行くでしょう。"]},{"title":"仮定と注意を結びつける","why":"万一 は万が一の事態を想定して備える表現です。","pattern":"万一 ... 就 ...","tip":"起こる確率が低くても備えたい状況に使います。","examples":["万一迟到了，请给我打电话。=万一遅刻したら電話してください。","万一出问题，我们就暂停。=万一問題が起きたら一時停止します。"]}],[{"title":"必要条件を理解する","why":"只有 ... 才 ... は条件がなければ結果が成立しないことを表します。","pattern":"只有 ... 才 ...","tip":"只要 ... 就 ... の十分条件との違いが重要です。","examples":["只有通过考试，才能毕业。=試験に合格して初めて卒業できます。","只有仔细检查，才会发现问题。=慎重に確認して初めて問題を発見できます。"]},{"title":"根拠の出典を示す","why":"根据 ... で判断の根拠を明示します。","pattern":"根据 + 资料 / 数据","tip":"データの記述と自分の解釈を分けましょう。","examples":["根据调查，人数有所增加。=調査によると人数がやや増えました。","根据现有证据，原因还不明确。=現在の証拠では原因はまだ不明です。"]},{"title":"主張を限定する","why":"在一定程度上 を使い、当てはまる範囲を限定します。","pattern":"在一定程度上 ...","tip":"一部で真実であっても常に正しいとは限りません。","examples":["这个办法在一定程度上有效。=この方法はある程度有効です。","这一结论并非适用于所有情况。=この結論はすべての場合に当てはまるわけではありません。"]},{"title":"比較して違いを説明する","why":"相比之下 は比較から目立つ違いを示します。","pattern":"相比之下 ...","tip":"比 と異なり前の文全体を対比することができます。","examples":["相比之下，第二种方法更稳定。=それに比べて二つ目の方法はより安定しています。","前者成本低，后者效率高。=前者は費用が低く、後者は効率が高いです。"]},{"title":"結果をまとめる","why":"综上所述 と 因此 で論旨をまとめます。","pattern":"综上所述 / 因此","tip":"文書の結論部で根拠から判断につなげます。","examples":["综上所述，这个方案值得考虑。=以上をまとめると、この案は検討する価値があります。","因此，我们暂时保留原计划。=したがって、しばらく元の計画を維持します。"]}],[{"title":"単なる一致と因果","why":"并不意味着 は表面的な事実から過剰な結論を導かない表現です。","pattern":"...并不意味着 ...","tip":"A と B が同時に起こっても A が B の原因とは限りません。","examples":["同时发生并不意味着存在因果关系。=同時に起きたからといって因果関係があるわけではありません。","相关并不等于因果。=相関は因果と同じではありません。"]},{"title":"例外を明示する","why":"除非 ... 否则 ... で例外の条件を示します。","pattern":"除非 ... 否则 ...","tip":"禁止や条件付きの主張で使われます。","examples":["除非有新的证据，否则不能下结论。=新しい証拠がない限り結論は出せません。","除非天气恶化，否则计划不变。=天候が悪化しない限り計画は変えません。"]},{"title":"確実性を慎重に述べる","why":"似乎 と 未必 で断定を避け、可能性を示します。","pattern":"似乎 / 未必","tip":"未必 は「必ずしも〜とは限らない」です。","examples":["结果似乎支持这一假设。=結果はこの仮説を支持しているようです。","这种方法未必适合所有人。=この方法がすべての人に合うとは限りません。"]},{"title":"条件付きで結論を出す","why":"在 ... 前提下 で判断が成立する条件を示します。","pattern":"在 ... 的前提下 ...","tip":"前提が変わると判断も変わり得ます。","examples":["在数据可靠的前提下，这个结论成立。=データが信頼できるという前提ならこの結論は成立します。","在资源有限的情况下，我们需要排序。=資源が限られる状況では優先順位が必要です。"]},{"title":"視点の違いを読み解く","why":"从 ... 角度来看 で、どの観点で評価しているかを明らかにします。","pattern":"从 ... 角度来看 ...","tip":"一つの観点で優れていても全体では異なる場合があります。","examples":["从成本的角度来看，这个选择合理。=費用の観点から見ればこの選択は合理的です。","从长期来看，还需要更多证据。=長期的に見ればさらに証拠が必要です。"]}]]};
for(const lang of Object.keys(COURSE))for(let lv=0;lv<10;lv++){
 const unit=COURSE[lang][lv];
 if(unit.sections.length!==5)throw new Error('Expected five previous sections for '+lang+' Lv.'+(lv+1));
 for(let j=0;j<5;j++){
  const item=EXTRA_V6[lang][lv][j];
  const old=unit.sections[j];
  // 新規の例文２つに既習の例文を追加。同じ意味の選択肢は作らない。
  const examples=[...item.examples];
  for(const ex of [...old.examples.slice(2),...old.examples.slice(0,2),...unit.sections.slice(0,5).flatMap(s=>s.examples)]){
   if(examples.length>=4)break;
   const jp=ex.split('=')[1];
   if(jp&&!examples.some(v=>v.split('=')[1]===jp))examples.push(ex);
  }
  if(examples.length!==4)throw new Error('Insufficient distinct examples');
  const e=examples.map(v=>v.split('='));
  const explanation=`${item.title}：${item.why}`;
  const quiz=[`「${e[0][0]}」の意味は？`,e[0][1],e[1][1],e[2][1],explanation];
  unit.sections.push(SC(item.title,item.why,item.pattern,examples,item.tip,quiz));
 }
}

 function getNextLesson(lang=data.lang){
  const courses=COURSE[lang];
  const passed=(lev,sec)=>!!data.learned?.[lang]?.[lev]?.[sec]?.passed;
  const search=(lev,sec)=>{
   for(let l=lev;l<=courses.length;l++){
    const from=l===lev?sec:0;
    for(let j=from;j<courses[l-1].sections.length;j++)if(!passed(l,j))return {level:l,section:j};
   }
   return null;
  };
  // 未学習の文字入門が残っている場合は、直近の応用教材より先に提案する。
  for(let l=1;l<=INTRO_SHIFT[lang];l++){
   for(let j=0;j<courses[l-1].sections.length;j++)if(!passed(l,j))return {level:l,section:j};
  }
  const recent=data.lastStudy?.[lang];
  if(recent&&courses[recent.level-1]?.sections?.[recent.section]){
   return search(recent.level,passed(recent.level,recent.section)?recent.section+1:recent.section)
    || search(1,0)||{level:recent.level,section:recent.section};
  }
  let latest=null;
  for(const [level,sections] of Object.entries(data.learned?.[lang]||{})){
   for(const [section,rec] of Object.entries(sections||{})){
    if(rec?.passed&&Number.isFinite(+rec.time)&&+rec.time>0&&(!latest||rec.time>latest.time))latest={level:+level,section:+section,time:+rec.time};
   }
  }
  if(latest)return search(latest.level,latest.section+1)||search(1,0)||{level:latest.level,section:latest.section};
  const f=Math.max(1,Math.min(COURSE[lang].length,Number(data.focusLevel)||1));
  return search(f,0)||search(1,0)||{level:f,section:0};
