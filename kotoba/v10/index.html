 }
 function recordAnswer(value,skipped=false){if(!quiz||quiz.phase!=='question')return;safeStop();const q=quiz.qs[quiz.idx];if(q.type==='s'&&!skipped&&!quiz.speechCaptured)return;const correct=!skipped&&isCorrect(q,value);quiz.chosen=value;quiz.phase='feedback';quiz.feedback={correct,skipped};quiz.results.push({type:q.type,correct,skipped});if(!skipped){data.history.push({id:q.id,lang:q.lang,level:q.level,type:q.type,mode:q.mode,category:q.category||'mixed',correct,time:Date.now()});data.history=data.history.slice(-15000);save();}render();}
 function next(){if(!quiz)return;safeStop();if(quiz.idx+1>=quiz.qs.length){data.complete++;save();page='result';render();}else{quiz.idx++;prep();render();}}
 function results(){let a=quiz?.results||[],correct=a.filter(x=>x.correct).length,skipped=a.filter(x=>x.skipped).length,incorrect=a.length-correct-skipped,pct=correct+incorrect?Math.round(100*correct/(correct+incorrect)):null;
 return h('train')+`<div class="ks-results"><section class="ks-panel"><div class="ks-medal">${pct===null?'📘':pct>=80?'🏆':'🌱'}</div><h2>${PRACTICE_MODES[quiz.kind].title}トレーニング完了！</h2><p class="ks-sub">レッスン ${quiz.level} の成績を記録しました。間違えた問題は「苦手を復習」に出やすくなります。</p><div class="ks-statline"><div class="ks-stat"><strong>${pct===null?'—':pct+'%'}</strong><small>採点対象の正答率</small></div><div class="ks-stat"><strong>${correct}</strong><small>正解</small></div><div class="ks-stat"><strong>${incorrect}</strong><small>不正解</small></div></div><div class="ks-summaries"><span class="ks-chip">スキップ ${skipped}問</span><span class="ks-chip">${a.length}問出題</span></div><div class="ks-actions ks-center"><button class="ks-btn" data-act="startQuiz">もう一度 ▶</button><button class="ks-btn ks-secondary" data-act="nav" data-page="stats">成長記録</button><button class="ks-btn ks-muted" data-act="nav" data-page="trainlevel">レッスン選択へ</button><button class="ks-btn ks-muted" data-act="nav" data-page="train">練習の種類へ</button></div></section></div>`;}
 function statsView(){
  clockCheckpoint();save();
  const s=score(),streak=streakDays(),mins=measuredMinutes(data.lang),acc=s.overall===null?'—':Math.round(s.overall*100)+'%';
  return h('stats')+`<h2>📈 ${LANG[data.lang][1]}の成長記録</h2>
  <div class="ks-insights" aria-label="学習の主な指標">
   <div class="ks-insight ks-streak"><strong>${streak}<span class="ks-insight-unit">日</span></strong><small>連続学習日数</small></div>
   <div class="ks-insight ks-time"><strong>${mins}<span class="ks-insight-unit">分</span></strong><small>計測した学習時間</small></div>
   <div class="ks-insight ks-accuracy"><strong>${acc}</strong><small>直近30回答の正答率</small></div>
  </div>
  <p class="ks-data-clarify">学習時間はこの改善版で教材・問題を開いている間だけ計測します（無操作が長い時間・バックグラウンドは除外）。旧版の時間は不明のため加算していません。連続日数は教材合格または問題回答があった日で集計しています。</p>
  <div class="ks-cols"><section class="ks-panel"><h3>現在 レッスン ${s.current} / ${COURSE[data.lang].length}</h3><div class="ks-statline"><div class="ks-stat"><strong>${s.attempts}</strong><small>回答した問題数</small></div><div class="ks-stat"><strong>${s.unique}</strong><small>異なる問題</small></div><div class="ks-stat"><strong>${s.overall===null?'—':Math.round(s.overall*100)+'%'}</strong><small>直近30回答</small></div></div><p class="ks-sub">各Lvで教材10セクション合格、異なる10問、3形式以上、入力・発話の回答2〜4問、直近10回答以上で正答率80%以上を目安に修了。未測定は未測定のまま。</p></section><section class="ks-panel"><h3>分野別の最近の正答率</h3>${Object.entries(SK).map(([key,t])=>{let c=s.bySkill[key],pct=c.accuracy===null?0:Math.round(c.accuracy*100);return`<div class="ks-progress-row"><div class="ks-line"><b>${t[0]} ${t[1]}</b><span>${c.accuracy===null?'未測定':pct+'%'}・${c.unique}種類</span></div>${bar(pct)}</div>`;}).join('')}</section></div><div class="ks-panel ks-mt"><h3>🧩 単語トレーニングの記録</h3><div class="ks-statline"><div class="ks-stat"><strong>${s.words.attempts}</strong><small>単語の回答数</small></div><div class="ks-stat"><strong>${s.words.unique}</strong><small>異なる単語問題</small></div><div class="ks-stat"><strong>${s.words.accuracy===null?'—':Math.round(s.words.accuracy*100)+'%'}</strong><small>直近30回答の正答率</small></div></div><p class="ks-sub">単語だけの正答率では文法・会話などの総合的な習得度は上がりません。</p></div><h3 class="ks-h3">レッスン別の達成状況</h3><div class="ks-stages">${s.perLevel.map(x=>smallProgress(x.lev,s)).join('')}</div><div class="ks-panel ks-mt"><h3>選択中 レッスン ${data.focusLevel}：${esc(COURSE[data.lang][data.focusLevel-1].title)}</h3>${(()=>{const x=s.perLevel[data.focusLevel-1];return`<div class="ks-statline"><div class="ks-stat"><strong>${x.sections}/${x.totalSections}</strong><small>教材セクション</small></div><div class="ks-stat"><strong>${x.unique}/10</strong><small>異なる問題</small></div><div class="ks-stat"><strong>${x.recent===null?'—':Math.round(x.recent*100)+'%'}</strong><small>直近正答率</small></div></div><p class="ks-sub">問題形式：${x.skills}/3 ・ 入力/発話した異なる問題：${x.productive}/${x.lev>=4?4:2}</p>`;})()}</div><div class="ks-note">この数値はアプリの収録教材に対する理解度・運用の推定であり、CEFR・TOPIK・HSKなどの正式な習熟度認定ではありません。話す力や実際の聞き取り能力まで、問題数だけで正確に断定することはできません。</div>`;}
 function dataView(){return h('data')+`<h2>📦 学習データ</h2><section class="ks-panel"><p class="ks-sub">この改善プレビューは本番データと別に保存します。通常の学習記録とは同期されません。必要ならバックアップしてください。</p><div class="ks-actions"><button class="ks-btn ks-secondary" data-act="export">バックアップを表示</button><button class="ks-btn ks-muted" data-act="copy">コピーする</button></div><label class="ks-q" for="ks-backup">保存する文字列（JSON形式）</label><textarea id="ks-backup" rows="5" placeholder="上のボタンで表示します"></textarea><h3>バックアップを読み込む</h3><textarea id="ks-restore" rows="5" placeholder="以前コピーしたJSONを貼り付け"></textarea><div class="ks-actions"><button class="ks-btn" data-act="restore">復元する</button><button class="ks-btn ks-danger" data-act="resetAsk">学習記録を初期化</button></div><div class="ks-note" id="ks-data-note">${esc(note||'読み込み時は現在の学習履歴を上書きします。')}</div><p class="ks-sub">収録トレーニング問題：${BANK.length}問（3言語合計）。費用・ライフ・広告・回数制限なし。</p></section>`;}
 function render(){if(!root)return;clockCheckpoint();save();let html=page==='home'?home():page==='language'?languageView():page==='learn'?learn():page==='learnsections'?lessonSections():page==='study'?studyView():page==='train'?trainingMenu():page==='trainlevel'?training():page==='quiz'?quizView():page==='result'?results():page==='stats'?statsView():page==='benchmark'?benchmarkView():dataView();root.innerHTML=html;attachFoundationCanvas();}
 function navigate(nextPage){safeStop();if(!['home','language','learn','learnsections','train','trainlevel','stats','data','benchmark'].includes(nextPage))nextPage='home';page=nextPage;session=null;quiz=null;render();}
 function speak(text){if(!('speechSynthesis' in window)){note='この環境では音声再生できません。スキップできます。';render();return;}try{window.speechSynthesis.cancel();let msg=new SpeechSynthesisUtterance(text);msg.lang=LANG[data.lang][2];msg.rate=.84;window.speechSynthesis.speak(msg);}catch(_){note='この環境で音声を再生できません。';render();}}
 function listenMic(){if(!quiz||quiz.phase!=='question')return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){note='音声認識に対応していません。スキップしてください。';render();return;}safeStop();try{recognition=new SR();recognition.lang=LANG[data.lang][2];recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=(event)=>{let txt=event.results?.[0]?.[0]?.transcript||'';quiz.chosen=txt;quiz.speechCaptured=!!txt;microphoneActive=false;const el=root.querySelector('#ks-answer');if(el)el.value=txt;const submit=root.querySelector('[data-act="check"]');if(submit)submit.disabled=!quiz.speechCaptured;const status=root.querySelector('#ks-micnote');if(status)status.textContent='認識しました。確認して回答してください。';};recognition.onerror=(e)=>{microphoneActive=false;note=`マイクを利用できません（${e.error||'権限/通信'}）。スキップできます。`;const el=root.querySelector('#ks-micnote');if(el)el.textContent=note;};recognition.onend=()=>{microphoneActive=false;};recognition.start();microphoneActive=true;const el=root.querySelector('#ks-micnote');if(el)el.textContent='聞き取っています…';}catch(_){note='音声認識を開始できません。ブラウザの権限をご確認ください。';render();}}
 function finishStudy(){if(!session)return;const l=session.level,i=session.section;if(!data.learned[data.lang])data.learned[data.lang]={};if(!data.learned[data.lang][l])data.learned[data.lang][l]={};const prev=data.learned[data.lang][l][i]||{};data.learned[data.lang][l][i]={...prev,seen:true,passed:!!((session.correct&&(COURSE[data.lang][l-1].sections[i].drills||session.typedCorrect))||prev.passed),time:Date.now()};save();navigate('learnsections');}
 root.addEventListener('pointerdown',touchActivity,{capture:true});
 root.addEventListener('keydown',touchActivity,{capture:true});
 root.addEventListener('change',e=>{const id=e.target.id;if(id==='ks-count'){data.count=+e.target.value;save();}if(id==='ks-audio'){data.audio=e.target.checked;save();}if(id==='ks-reading'){data.reading=e.target.checked;save();}if(id==='ks-speaking'){data.speaking=e.target.checked&&supportsSpeech;save();}});
 let benchmarkFromPage='home';
 root.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b||!root.contains(b))return;e.preventDefault();let act=b.dataset.act;
  try{
   if(act==='nav'){navigate(b.dataset.page);}
   else if(act==='benchmark'){benchmarkFromPage=page==='benchmark'?'home':page;navigate('benchmark');}
   else if(act==='benchmarkBack'){navigate(benchmarkFromPage);}
   else if(act==='languages'){navigate('language');}
   else if(act==='lang'){safeStop();data.lang=b.dataset.lang;data.focusLevel=score().current;save();navigate('home');}
   else if(act==='focus'){data.focusLevel=+b.dataset.level;save();if(page==='learn')navigate('learnsections');else render();}
   else if(act==='study'){studyStart(+b.dataset.level,+b.dataset.sec);}
   else if(act==='openLessonSections'){data.focusLevel=+b.dataset.level;save();navigate('learnsections');}

   else if(act==='foundationNext'){
    if(!session)return;
    const sec=COURSE[data.lang][session.level-1]?.sections[session.section];
    if(!sec?.drills)return;
    if(session.step>=3&&session.step<3+sec.drills.length&&!session.didCheck)return;
    session.step=Math.min(sec.drills.length+3,session.step+1);
    session.didCheck=false;session.lastAnswer='';session.drillCorrect=false;render();
   }
   else if(act==='foundationBack'){
    if(!session)return;
    if(session.step===0)navigate('learnsections');
    else{session.step--;session.didCheck=false;session.lastAnswer='';session.drillCorrect=false;render();}
   }
   else if(act==='foundationCheck'){
    if(!session)return;
    const section=COURSE[data.lang][session.level-1].sections[session.section];
    const idx=session.order[session.step-3];
    const q=section?.drills?.[idx];
    const value=root.querySelector('#ks-foundation-answer')?.value?.trim()||'';
    if(!q||!value){root.querySelector('#ks-foundation-answer')?.focus();return;}
    const ok=matchFoundationAnswer(value,q.correct);
    if(session.firstTry[idx]===undefined)session.firstTry[idx]=ok;
    session.drillCorrect=ok;session.didCheck=true;session.lastAnswer=value;render();
   }
   else if(act==='foundationRetry'){
    if(!session)return;
    const section=COURSE[data.lang][session.level-1].sections[session.section];
    session.step=3;session.order=shuffle([...Array(section.drills.length).keys()]);session.firstTry={};session.lastAnswer='';session.didCheck=false;session.drillCorrect=false;session.correct=false;render();
   }
   else if(act==='clearCanvas'){const c=root.querySelector('#ks-foundation-canvas');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);}
   else if(act==='studyTypeCheck'){if(!session)return;const sec=COURSE[data.lang][session.level-1].sections[session.section];if(sec.drills||session.step!==10||!session.correct)return;const expected=formatExample(sec.examples[3])[0];const value=root.querySelector('#ks-study-typed')?.value?.trim()||'';if(!value){root.querySelector('#ks-study-typed')?.focus();return;}session.typedAnswer=value;session.typedCorrect=normalize(value)===normalize(expected);session.typedChecked=true;render();}
   else if(act==='studyNext'){if(session.step===9&&!session.correct)return;session.step=Math.min(10,session.step+1);session.revealed=false;render();}
   else if(act==='studyBack'){if(session.step===0)navigate('learnsections');else{session.step--;session.checked=false;session.revealed=false;render();}}
   else if(act==='studyReveal'){session.revealed=!session.revealed;render();}
   else if(act==='studyPracticePick'){if(session&&session.step===6&&!session.practiceChecked){session.practiceSelected=+b.dataset.idx;session.practiceChecked=true;render();}}
   else if(act==='studyChoice'){if(session&&!session.checked){session.selected=+b.dataset.idx;render();}}
   else if(act==='studyCheck'){if(session&&session.selected!==null){session.checked=true;session.correct=session.options[session.selected]===COURSE[data.lang][session.level-1].sections[session.section].quiz[1];render();}}
   else if(act==='studyRetry'){session.selected=null;session.checked=false;render();}
   else if(act==='studyFinish'){if(!session)return;const sec=COURSE[data.lang][session.level-1].sections[session.section];if(session.correct&&(sec.drills||session.typedCorrect))finishStudy();}
   else if(act==='fromlevel'){data.focusLevel=+b.dataset.level;trainingMode='mixed';save();navigate('trainlevel');}
    else if(act==='practiceMode'){if(PRACTICE_MODES[b.dataset.mode]){trainingMode=b.dataset.mode;note='';navigate('trainlevel');}}
   else if(act==='startQuiz'){startQuiz(false);}
   else if(act==='startWords'){trainingMode='words';startQuiz(false);}
   else if(act==='reviewWords'){trainingMode='words';startQuiz(true);}
   else if(act==='reviewQuiz'){startQuiz(true);}
   else if(act==='pick'){if(quiz?.phase==='question')recordAnswer(quiz.options[+b.dataset.idx]);}
   else if(act==='tile'){if(quiz?.phase==='question'){let idx=+b.dataset.idx;if(!quiz.order.includes(idx))quiz.order.push(idx);render();}}
   else if(act==='untile'){if(quiz?.phase==='question'){quiz.order.splice(+b.dataset.idx,1);render();}}
   else if(act==='check'){if(!quiz||quiz.phase!=='question')return;let q=quiz.qs[quiz.idx];if(q.type==='s'&&!quiz.speechCaptured)return;if(q.mode==='order'){if(quiz.order.length!==quiz.tiles.length){note='すべての単語を並べてください。';return;}recordAnswer(quiz.order.map(i=>quiz.tiles[i].t).join(' '));}else{let input=root.querySelector('#ks-answer');const v=input?.value?.trim()||'';if(!v){input?.focus();return;}recordAnswer(v);}}
   else if(act==='skip'){recordAnswer('',true);}
   else if(act==='next'){next();}
   else if(act==='hear'){speak(b.dataset.text);}
   else if(act==='record'){listenMic();}
   else if(act==='export'){root.querySelector('#ks-backup').value=JSON.stringify(data);}
   else if(act==='copy'){let area=root.querySelector('#ks-backup');if(!area.value)area.value=JSON.stringify(data);area.select();try{await navigator.clipboard.writeText(area.value);note='コピーしました。';}catch(_){note='コピーできない場合は選択中の文字列を手動でコピーしてください。';}root.querySelector('#ks-data-note').textContent=note;}
   else if(act==='restore'){try{const obj=JSON.parse(root.querySelector('#ks-restore').value);if(!obj||!LANG[obj.lang]||!Array.isArray(obj.history)||!obj.learned)throw Error('bad');data={...fresh(),...obj};migrateCurriculum();save();note='読み込みが完了しました。';navigate('home');}catch(_){note='形式が違うため読み込めませんでした。';root.querySelector('#ks-data-note').textContent=note;}}
   else if(act==='resetAsk'){root.querySelector('#ks-data-note').innerHTML='<strong>本当に全言語の学習データを消去しますか？</strong> <button class="ks-btn ks-danger ks-sm" data-act="resetFinal">削除を確定する</button>';}
   else if(act==='resetFinal'){data=fresh();save();note='学習履歴を初期化しました。';navigate('home');}
  }catch(error){note='操作中に問題が発生しました。ホームへ戻って続けられます。';try{console.error('Kotoba Step error',error);}catch(_){}if(page==='quiz'||page==='study'){const el=root.querySelector('.ks-tools');if(el)el.insertAdjacentHTML('beforeend',`<div class="ks-note">${esc(note)}</div>`);}else render();}
 });
 root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ks-study-typed'){e.preventDefault();root.querySelector('[data-act="studyTypeCheck"]')?.click();}if(e.key==='Enter'&&e.target.id==='ks-foundation-answer'){e.preventDefault();root.querySelector('[data-act="foundationCheck"]')?.click();}if(e.key==='Enter'&&e.target.id==='ks-answer'&&quiz?.phase==='question'){e.preventDefault();const v=e.target.value?.trim();if(v)recordAnswer(v);}});
 save();render();
})();
</script></body></html>
